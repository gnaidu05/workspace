<title>CampusRoute Planner</title>
<style>
/* CampusRoute — one stylesheet, no framework, no build step. */

:root {
  --green: #174d45;
  --teal: #247365;
  --ink: #203a35;
  --muted: #6d7f78;
  --line: #e1e8e4;
  --paper: #fff;
  --ground: #f5f7f7;
  --lime: #dcecbb;
  --amber: #b5852f;
  --rust: #a24a3c;
  --purple: #8b79bb;
  --radius: 10px;
  color-scheme: light;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
  background: var(--ground);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; } /* read-only mode hides controls with .hidden */
body { margin: 0; background: var(--ground); color: var(--ink); }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: 0; background: none; color: inherit; }
button:disabled { opacity: .5; cursor: default; }
a { color: inherit; }
svg { display: block; }
input, select, textarea { min-width: 0; color: var(--ink); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
[tabindex]:focus-visible { outline: 3px solid #a6c9ab; outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0 0 .4rem; }
p { margin: 0 0 .5rem; }

.icon { width: 18px; height: 18px; display: inline-block; vertical-align: middle; flex-shrink: 0; }
.boot { padding: 15vh 8vw; }
.muted-text { color: var(--muted); font-size: .875rem; }

/* ---------- shell ---------- */

.shell { min-height: 100vh; display: grid; grid-template-columns: 78px 1fr; }
.rail {
  background: var(--green); display: flex; align-items: center; flex-direction: column; gap: 14px;
  padding: 24px 0; position: sticky; top: 0; height: 100vh; color: #c0d5cc;
}
.brand-icon { width: 42px; height: 42px; display: grid; place-items: center; margin-bottom: 18px; }
.brand-icon svg { width: 36px; height: 36px; }
.rail-button { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; color: #b7cec5; }
.rail-button:hover, .rail-button.active { background: #ffffff1c; color: #e3efca; }
.rail-button .icon { width: 21px; height: 21px; }
.rail-spacer { flex: 1; }

.workspace { min-width: 0; }
.topbar {
  height: 74px; border-bottom: 1px solid var(--line); display: flex; align-items: center;
  justify-content: space-between; padding: 0 32px; background: #ffffffa6; gap: 16px; flex-wrap: wrap;
}
.wordmark { font-size: 20px; letter-spacing: -.5px; font-weight: 750; }
.wordmark span { font-weight: 400; }
.breadcrumb { display: flex; align-items: center; gap: 14px; }
.breadcrumb .slash, .breadcrumb small { color: #52645e; font-size: .875rem; }
.top-actions { display: flex; align-items: center; gap: 14px; }
.private { display: inline-flex; align-items: center; gap: 7px; font-size: .875rem; color: #5e756c; }
.private .icon { width: 15px; height: 15px; }
main { max-width: 1520px; margin: 0 auto; padding: 28px 32px 40px; }

.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 20px; flex-wrap: wrap; }
.hero h1 { font-size: 31px; letter-spacing: -1.1px; font-weight: 620; line-height: 1.2; }
.hero p { font-size: .875rem; line-height: 1.7; color: #52645e; margin: 0; }
.hero-actions { display: flex; gap: 9px; align-items: center; }

/* ---------- buttons, tags, notices ---------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px;
  padding: 10px 14px; font-size: .875rem; font-weight: 600; transition: background .15s, border-color .15s;
  border: 1px solid transparent; white-space: nowrap;
}
.btn.primary { background: var(--green); color: #fff; }
.btn.primary:hover:not(:disabled) { background: #12403a; }
.btn.secondary { background: var(--paper); border-color: var(--line); }
.btn.secondary:hover:not(:disabled) { border-color: #c3d2cb; }
.btn.danger { background: #fdf3f1; color: var(--rust); border-color: #f0d6d0; }
.btn.small { padding: 7px 11px; font-size: .8125rem; }
.text-button { color: var(--teal); font-weight: 600; font-size: .8125rem; text-decoration: underline; text-underline-offset: 3px; }

.tag {
  display: inline-flex; align-items: center; gap: 5px; font-size: .75rem; font-weight: 650; letter-spacing: .3px;
  padding: 3px 8px; border-radius: 999px; background: #eef2ef; color: #4a5f57;
}
.tag.good { background: var(--lime); color: #38512c; }
.tag.warn { background: #fbf0dd; color: #7d5a1c; }
.tag.bad { background: #fbe6e2; color: var(--rust); }
.tag.demo { background: #ece8f7; color: #4c3d7a; }
.tag.muted { background: #f0f2f1; color: #5c6d66; }
.route-tag { cursor: pointer; }

.notice {
  background: var(--paper); border: 1px solid var(--line); border-left: 3px solid var(--teal); border-radius: var(--radius);
  padding: 12px 16px; margin-bottom: 16px; font-size: .875rem; display: flex; flex-wrap: wrap; gap: 10px 16px;
  align-items: center; justify-content: space-between;
}
.notice.error { border-left-color: var(--rust); }
.notice ul { margin: 6px 0 0; padding-left: 20px; width: 100%; }
.notice li { margin-bottom: 4px; }
.share-bar .share-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.saved-label { color: #4d6159; }
.saved { color: var(--teal); font-weight: 650; }

.demo-note {
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  background: #ffffffb8; border: 1px dashed #cfdbd4; border-radius: var(--radius); padding: 10px 16px;
  margin-bottom: 14px; font-size: .875rem;
}
.demo-note span { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ---------- metrics ---------- */

.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 14px; margin-bottom: 20px; }
.metric { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.metric.accent { background: linear-gradient(150deg, #1c574d, #23705f); color: #eaf3e2; border-color: #1c574d; }
.metric-label { display: flex; align-items: center; justify-content: space-between; font-size: .75rem;
  letter-spacing: .6px; text-transform: uppercase; font-weight: 700; color: #7a8c85; margin-bottom: 10px; }
.metric.accent .metric-label { color: #bcd5b8; }
.metric-value { font-size: 27px; font-weight: 640; letter-spacing: -.8px; line-height: 1.1; }
.metric-value small { font-size: .8125rem; font-weight: 500; margin-left: 6px; color: #7a8c85; letter-spacing: 0; }
.metric.accent .metric-value small { color: #bcd5b8; }
.metric-foot { font-size: .8125rem; color: #6d7f78; margin-top: 8px; }
.metric.accent .metric-foot, .metric.accent .saved { color: #d6e8c8; }

/* ---------- tabs ---------- */

.tabs { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; flex-wrap: wrap; }
.tabs button {
  display: inline-flex; align-items: center; gap: 8px; padding: 11px 14px; font-size: .875rem; font-weight: 600;
  color: #64756e; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tabs button.active { color: var(--green); border-bottom-color: var(--green); }
.tabs .count { background: #eef2ef; border-radius: 999px; padding: 1px 7px; font-size: .75rem; }
.tabs .right { margin-left: auto; font-size: .8125rem; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; padding: 0 6px; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #8fb98f; display: inline-block; }
.status-dot.busy { background: var(--amber); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* ---------- panels ---------- */

.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; margin-bottom: 16px; }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.panel-head h2 { font-size: 1.0625rem; font-weight: 650; }
.panel-head p { font-size: .8125rem; color: var(--muted); margin: 0; }
.head-actions, .row-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.panel-footer {
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  border-top: 1px solid var(--line); margin-top: 16px; padding-top: 14px; font-size: .8125rem; color: var(--muted);
}
.panel.empty, .empty { text-align: center; color: var(--muted); padding: 30px 20px; font-size: .875rem; }
.panel.empty h3 { color: var(--ink); font-size: 1.0625rem; }
.panel.empty .icon { width: 30px; height: 30px; margin: 0 auto 10px; color: #a9bdb4; }
.form-note { font-size: .8125rem; color: var(--muted); line-height: 1.6; margin-top: 12px; }
.geo-attribution { font-size: .75rem; color: #8a9a93; line-height: 1.7; margin: 10px 2px 0; }
.footnote {
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); font-size: .8125rem; color: var(--muted);
}
.footnote span { display: inline-flex; align-items: center; gap: 8px; }

/* ---------- routes ---------- */

.plan-workspace { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
.routes-panel { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
.route-card {
  border: 1px solid var(--line); border-left: 3px solid var(--route, var(--teal)); border-radius: 10px;
  padding: 13px 15px; margin-bottom: 10px; cursor: pointer; background: #fcfdfc;
}
.route-card:hover { border-color: #c6d5cd; }
.route-card.selected { background: #f3f8f3; border-color: var(--route); box-shadow: 0 1px 0 #e6efe6; }
.route-top { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.route-id { font-size: .75rem; font-weight: 750; color: var(--route); letter-spacing: .5px; }
.route-title { font-weight: 640; font-size: .9375rem; flex: 1; min-width: 0; }
.check-circle { color: var(--route); }
.check-circle .icon { width: 16px; height: 16px; }
.route-path { font-size: .8125rem; color: #5f7169; display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 9px; }
.route-path .base { font-weight: 650; color: var(--green); }
.route-path .path-arrow { color: #a8bab2; }
.route-meta, .route-bottom { display: flex; gap: 12px; flex-wrap: wrap; font-size: .8125rem; color: #5f7169; }
.route-meta span, .route-bottom span { display: inline-flex; align-items: center; gap: 5px; }
.route-meta .icon { width: 15px; height: 15px; color: #8ba295; }
.route-bottom { margin-top: 8px; border-top: 1px dashed #e3eae5; padding-top: 8px; justify-content: space-between; }
.tiny-avatar {
  width: 21px; height: 21px; border-radius: 50%; background: #e5eade; color: #4b665b;
  display: inline-grid; place-items: center; font-size: .6875rem; font-weight: 700;
}
.avatar { height: 34px; width: 34px; display: grid; place-items: center; border-radius: 50%;
  font-size: .875rem; font-weight: 650; background: #e5eade; color: #4b665b; }

.view-toggle { display: flex; gap: 4px; background: #f1f4f2; border-radius: 9px; padding: 3px; margin-bottom: 16px; flex-wrap: wrap; }
.view-toggle button { padding: 8px 13px; border-radius: 7px; font-size: .8125rem; font-weight: 600; color: #64756e; }
.view-toggle button.active { background: var(--paper); color: var(--green); box-shadow: 0 1px 2px #0000000f; }

/* itinerary */
.itinerary-day { margin-bottom: 18px; }
.itinerary-day h3 { font-size: .875rem; font-weight: 700; letter-spacing: .3px; display: flex; gap: 10px; align-items: baseline; }
.itinerary-day h3 span { font-weight: 500; color: var(--muted); font-size: .8125rem; }
.journey-steps { list-style: none; margin: 0; padding: 0; border-left: 2px solid #e7eee9; }
.journey-step { display: grid; grid-template-columns: 108px 1fr auto; gap: 12px; padding: 10px 0 10px 14px; position: relative; }
.journey-step::before {
  content: ''; position: absolute; left: -6px; top: 17px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--teal); border: 2px solid #fff;
}
.journey-step.travel::before { background: #9fb6a4; }
.journey-step.overnight::before { background: var(--purple); }
.step-time { font-size: .8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.step-label { font-size: .6875rem; text-transform: uppercase; letter-spacing: .7px; font-weight: 700; color: #8a9a93; display: block; }
.step-body strong { display: block; font-size: .9375rem; font-weight: 620; margin: 2px 0 3px; }
.step-body small { color: var(--muted); font-size: .8125rem; line-height: 1.55; display: block; }
.step-side { display: flex; align-items: center; gap: 7px; color: #7d9188; font-size: .8125rem; }

.duty-table { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
.duty-table h4 { font-size: .8125rem; text-transform: uppercase; letter-spacing: .6px; color: #8a9a93; }
table { border-collapse: collapse; width: 100%; font-size: .8125rem; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #eef2ef; vertical-align: top; }
th { font-size: .6875rem; text-transform: uppercase; letter-spacing: .6px; color: #8a9a93; }
td.over { color: var(--rust); font-weight: 650; }

/* gantt */
.timeline-wrap { overflow-x: auto; }
.gantt { min-width: 620px; }
.gantt-header { display: grid; grid-template-columns: 190px 1fr; align-items: end; font-size: .6875rem;
  text-transform: uppercase; letter-spacing: .6px; color: #8a9a93; margin-bottom: 8px; }
.gantt-days { display: grid; grid-template-columns: repeat(var(--days), 1fr); }
.gantt-days span { text-align: center; padding-bottom: 4px; border-left: 1px solid #eef2ef; }
.gantt-days .weekend { background: #f7f9f7; }
.gantt-row { display: grid; grid-template-columns: 190px 1fr; align-items: center; margin-bottom: 6px; }
.gantt-label { font-size: .8125rem; color: #5f7169; display: flex; align-items: center; gap: 7px; padding-right: 10px; }
.gantt-label .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--route); flex-shrink: 0; }
.gantt-track { position: relative; height: 24px; background: #f7f9f8; border-radius: 5px; }
.gantt-bar {
  position: absolute; top: 3px; height: 18px; border-radius: 4px; background: var(--teal); color: #fff;
  font-size: .6875rem; font-weight: 700; display: grid; place-items: center; min-width: 3px;
}
.gantt-bar.interview { background: #3f7f9c; }
.gantt-bar.travel { background: #9fb6a4; }
.gantt-bar.travel.air { background: var(--purple); }
.gantt-bar.travel.train { background: var(--amber); }
.gantt-bar.overnight { background: #c9c0e3; }
.timeline-legend, .map-legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
  font-size: .8125rem; color: var(--muted); margin-top: 12px; }
.timeline-legend .square, .map-legend .legend-line { width: 12px; height: 12px; border-radius: 3px; display: inline-block; background: var(--teal); margin-right: 5px; }
.timeline-legend .square.interview { background: #3f7f9c; }
.timeline-legend .square.road { background: #9fb6a4; }
.timeline-legend .square.air { background: var(--purple); }
.timeline-legend .square.train { background: var(--amber); }
.timeline-legend .square.night { background: #c9c0e3; }
.map-legend .legend-line { height: 2px; width: 18px; border-radius: 0; }
.map-legend .legend-line.dashed { background: repeating-linear-gradient(90deg, var(--purple) 0 4px, transparent 4px 8px); }
.map-legend .legend-line.train { background: repeating-linear-gradient(90deg, var(--amber) 0 6px, transparent 6px 9px); }

/* legs */
.leg-table td small { display: block; color: var(--muted); font-size: .75rem; margin-top: 2px; }
.leg-table tr.custom { background: #fcfbf6; }
.leg-table td.unavailable { color: #b8c4bf; }
.mode-pill { display: inline-flex; align-items: center; gap: 5px; font-size: .75rem; font-weight: 700;
  padding: 3px 8px; border-radius: 999px; background: #eef2ef; color: #4a5f57; }
.mode-pill .icon { width: 14px; height: 14px; }
.mode-pill.air { background: #ece8f7; color: #4c3d7a; }
.mode-pill.train { background: #fbf0dd; color: #7d5a1c; }

/* map */
.supporting-map summary { cursor: pointer; font-weight: 640; font-size: .9375rem; margin-bottom: 12px; }
.map-container { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #edf3f4; }
.map-svg { width: 100%; height: auto; }
.map-north { position: absolute; top: 10px; right: 12px; font-size: .6875rem; font-weight: 700; color: #7d9188;
  display: flex; align-items: center; gap: 3px; }
.map-north .icon { width: 13px; height: 13px; }
.map-label { position: absolute; bottom: 10px; left: 14px; font-size: .6875rem; font-weight: 750; letter-spacing: 1px; color: #6a8177; }
.map-stop-key { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 7px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.map-stop-key li { display: flex; gap: 9px; align-items: flex-start; font-size: .8125rem; }
.stop-number { width: 20px; height: 20px; border-radius: 50%; background: #e5eade; color: #4b665b;
  display: grid; place-items: center; font-size: .6875rem; font-weight: 700; flex-shrink: 0; }
.map-stop-key small { display: block; color: var(--muted); }

/* ---------- colleges ---------- */

.college-search { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.college-search .field { flex: 1; min-width: 240px; }
.college-search span { font-size: .8125rem; color: var(--muted); }
.campus-list { display: grid; gap: 10px; }
.campus-card { border: 1px solid var(--line); border-radius: 10px; padding: 13px 15px; background: #fcfdfc; }
.campus-head { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.campus-head h3 { font-size: .9375rem; font-weight: 640; margin: 0 0 2px; }
.campus-head p { font-size: .8125rem; color: var(--muted); margin: 0; }
.campus-tags { display: flex; gap: 7px; flex-wrap: wrap; margin: 9px 0; }
.campus-dates { display: flex; gap: 14px; flex-wrap: wrap; }
.campus-dates label { display: grid; gap: 4px; font-size: .75rem; text-transform: uppercase; letter-spacing: .5px; color: #8a9a93; font-weight: 700; }
.campus-dates input { border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; background: #fff; }
.campus-dates small { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted); font-size: .75rem; }
.campus-transport { margin-top: 10px; display: grid; gap: 4px; }
.transport-line { color: var(--muted); font-size: .8125rem; }
.transport-line strong { color: #5f7169; }

/* ---------- teams and people ---------- */

.team-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.team-card { border: 1px solid var(--line); border-radius: 10px; padding: 15px; background: #fcfdfc; }
.team-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.team-card h3 { font-size: .9375rem; font-weight: 640; }
.team-card p { font-size: .8125rem; color: var(--muted); margin: 0 0 4px; }
.team-members { font-size: .8125rem; color: #5f7169; }
.person-list { display: grid; gap: 10px; }
.person-row { border: 1px solid var(--line); border-radius: 10px; padding: 13px 15px; display: grid;
  grid-template-columns: minmax(200px, 260px) 1fr; gap: 16px; background: #fcfdfc; }
.person-row h3 { font-size: .9375rem; font-weight: 640; }
.person-row p { font-size: .8125rem; color: var(--muted); margin: 0; }
.person-totals { display: flex; gap: 12px; flex-wrap: wrap; font-size: .8125rem; color: #5f7169; margin-top: 8px; }
.person-routes { display: grid; gap: 8px; }
.person-route { text-align: left; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: #fff; display: grid; gap: 2px; }
.person-route strong { font-size: .875rem; font-weight: 620; }
.person-route span { font-size: .75rem; color: var(--muted); }

/* ---------- forms and dialogs ---------- */

.field { display: grid; gap: 5px; font-size: .8125rem; font-weight: 600; color: #4d6159; }
.field input, .field select, .field textarea {
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: #fff; font-weight: 500;
}
.field small { font-weight: 500; color: var(--muted); font-size: .75rem; }
.field-row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.check-field { display: flex; align-items: center; gap: 8px; font-size: .8125rem; color: #4d6159; }
.check-field input { width: 16px; height: 16px; }
.settings-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.assumptions-copy { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-top: 18px;
  border-top: 1px solid var(--line); padding-top: 16px; }
.assumptions-copy h3 { font-size: .8125rem; text-transform: uppercase; letter-spacing: .6px; color: #8a9a93; }
.assumptions-copy p { font-size: .8125rem; color: #5f7169; line-height: 1.65; }

dialog#editor {
  border: 0; border-radius: 14px; padding: 0; max-width: min(560px, 94vw); width: 100%;
  box-shadow: 0 20px 60px #0f2b2508;
}
dialog#editor.wide { max-width: min(840px, 96vw); }
dialog#editor::backdrop { background: #10251fa8; }
.dialog-head { display: flex; justify-content: space-between; gap: 14px; padding: 20px 22px 12px; border-bottom: 1px solid var(--line); }
.dialog-head h2 { font-size: 1.0625rem; font-weight: 650; }
.dialog-head p { font-size: .8125rem; color: var(--muted); margin: 0; }
.dialog-head .close { color: var(--muted); }
.dialog-body { padding: 18px 22px; display: grid; gap: 14px; max-height: min(66vh, 640px); overflow: auto; }
.dialog-body > div > strong { display: block; margin-bottom: 4px; }
.dialog-footer { display: flex; justify-content: flex-end; gap: 9px; padding: 14px 22px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.dialog-error { color: var(--rust); font-size: .8125rem; }
fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; }
legend { font-size: .75rem; text-transform: uppercase; letter-spacing: .6px; font-weight: 700; color: #8a9a93; padding: 0 6px; }
.search-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.search-row .field { flex: 1; min-width: 200px; }
.location-results { display: grid; gap: 7px; }
.location-result { text-align: left; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: #fff; display: grid; gap: 2px; }
.location-result:hover { border-color: #c3d2cb; background: #fbfdfb; }
.location-result small { color: var(--muted); font-size: .75rem; }
.campus-pin-state { font-size: .8125rem; color: #5f7169; }
.model-summary { background: #f7f9f8; border-radius: 9px; padding: 12px 14px; font-size: .8125rem; }
.model-summary h4 { font-size: .75rem; text-transform: uppercase; letter-spacing: .6px; color: #8a9a93; }
.model-summary p { margin: 0 0 3px; color: #5f7169; }
.staffing-team { border-top: 1px dashed #e3eae5; padding-top: 9px; display: grid; gap: 5px; }
.staffing-team:first-child { border-top: 0; padding-top: 0; }
.member-choice small { color: var(--muted); font-size: .75rem; }
.member-choice.unavailable { color: #a4b1ab; }
.availability-rows { display: grid; gap: 10px; }
.availability-row { display: grid; grid-template-columns: minmax(120px, 1fr) auto auto auto; gap: 10px; align-items: end; }
.compare-table tr.current { background: #f3f8f3; }
.pin-list { font-size: .8125rem; color: #5f7169; }

#toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); background: #14332c; color: #eaf3e2;
  padding: 11px 18px; border-radius: 999px; font-size: .875rem; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; z-index: 60; max-width: 90vw; text-align: center;
}

// ---- geography.js ----
// Geography helpers and the three public map services this planner talks to.
//
//   Photon    – place search, to turn a college name into a campus pin
//   OSRM      – a road duration/distance matrix between the plan's points
//   Overpass  – nearest passenger railway stations (see railway.js)
//
// All three are free, community-run endpoints, so every call here is rate
// limited, cached and cancellable, and only place text plus coordinates ever
// leave the browser — team names, member names and dates never do.

const GEO_SERVICES = {
  search: 'https://photon.komoot.io/api/',
  routing: 'https://router.project-osrm.org'
};

const isCoordinate = (p) =>
  !!p && Number.isFinite(p.lat) && Number.isFinite(p.lng) && Math.abs(p.lat) <= 90 && Math.abs(p.lng) <= 180;

// Six decimals (~10 cm) is the key used for matrix lookups and overrides, so a
// pin that moves at all gets a fresh estimate rather than a stale one.
const pointKey = (p) => Number(p.lng).toFixed(6) + ',' + Number(p.lat).toFixed(6);
const matrixSignature = (points) => [...new Set(points.map(pointKey))].sort().join(';');

const isDemo = (c) => c.demo === true || (c.demo !== false && /\(demo\)\s*$/i.test(c.name || ''));
// A pin only counts once a person has confirmed it: a search hit alone is a
// suggestion, and planning refuses to price travel to a guess.
const hasCampus = (c) => isCoordinate(c.location) && c.location.confirmed === true;

const mapLink = (p) =>
  `https://www.openstreetmap.org/?mlat=${Number(p.lat)}&mlon=${Number(p.lng)}#map=17/${Number(p.lat)}/${Number(p.lng)}`;

const directionsLink = (a, b) =>
  `https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route=${a.lat},${a.lng};${b.lat},${b.lng}`;

// Accept a pasted point, but never a map viewport: `@lat,lng` in a map URL is
// where the camera was, not where the campus is.
function extractCoordinates(value) {
  const v = String(value || '').trim();
  let m;
  if (
    (m = v.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/)) ||
    (m = v.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/)) ||
    (m = v.match(/[?&](?:q|query|mlat)=(-?\d+(?:\.\d+)?)(?:,|%2C)(-?\d+(?:\.\d+)?)/i))
  ) {
    const p = { lat: Number(m[1]), lng: Number(m[2]) };
    return isCoordinate(p) ? p : null;
  }
  try {
    const url = new URL(v);
    const p = { lat: Number(url.searchParams.get('mlat')), lng: Number(url.searchParams.get('mlon')) };
    if (url.searchParams.has('mlat') && url.searchParams.has('mlon') && isCoordinate(p)) return p;
  } catch {
    /* not a URL */
  }
  return null;
}

// ---------------------------------------------------------------------------
// Cached road matrix
// ---------------------------------------------------------------------------

function validateMatrix(m) {
  if (!m) return true;
  const keys = m.pointKeys;
  const n = keys?.length;
  if (
    !Array.isArray(keys) || !n || n > 100 || new Set(keys).size !== n ||
    !Number.isFinite(m.updatedAt) ||
    !Array.isArray(m.durations) || !Array.isArray(m.distances) ||
    m.durations.length !== n || m.distances.length !== n
  ) return false;
  if (!keys.every((k) => typeof k === 'string' && /^-?\d+\.\d{6},-?\d+\.\d{6}$/.test(k))) return false;
  const rowsOk = [m.durations, m.distances].every((rows) =>
    rows.every((row) => Array.isArray(row) && row.length === n && row.every((v) => v === null || (Number.isFinite(v) && v >= 0 && v < 1e8)))
  );
  return (
    rowsOk &&
    Array.isArray(m.snapped) && m.snapped.length === n &&
    m.snapped.every((p) => isCoordinate(p) && Number.isFinite(p.distance) && p.distance >= 0)
  );
}

// Look one leg up in the cached matrix. `null` means "not measured — estimate
// it"; `unreachable` means the router said there is no road connection.
function networkRoad(a, b, state) {
  const m = state.network;
  if (!m) return null;
  const i = m.pointKeys.indexOf(pointKey(a));
  const j = m.pointKeys.indexOf(pointKey(b));
  if (i < 0 || j < 0) return null;
  const seconds = m.durations[i]?.[j];
  const metres = m.distances[i]?.[j];
  if (seconds === null || metres === null) return { unreachable: true, source: 'road-network' };
  if (!Number.isFinite(seconds) || !Number.isFinite(metres)) return null;
  const snap = Math.max(m.snapped[i]?.distance || 0, m.snapped[j]?.distance || 0);
  return {
    hours: seconds / 3600,
    distance: metres / 1000,
    source: 'road-network',
    updatedAt: m.updatedAt,
    snap,
    stale: Date.now() - m.updatedAt > 7 * 86400000
  };
}

function parseRoadMatrix(data, points, at = Date.now()) {
  if (data.code !== 'Ok') throw new Error('Road routing returned ' + (data.code || 'an invalid response') + '. Check the campus pins.');
  const m = {
    pointKeys: points.map(pointKey),
    durations: data.durations,
    distances: data.distances,
    snapped: (data.sources || []).map((p) => ({ lng: p.location?.[0], lat: p.location?.[1], distance: p.distance ?? 0 })),
    updatedAt: at,
    signature: matrixSignature(points),
    source: 'OSRM / OpenStreetMap'
  };
  if (!validateMatrix(m)) throw new Error('Road routing returned incomplete durations or distances.');
  return m;
}

// ---------------------------------------------------------------------------
// Network calls
// ---------------------------------------------------------------------------

const searchCache = new Map();
let lastSearch = 0;
let lastRoute = 0;

async function fetchJSON(url, fetcher = fetch) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 25000);
  try {
    const r = await fetcher(url, { signal: controller.signal, credentials: 'omit', referrerPolicy: 'strict-origin-when-cross-origin' });
    if (!r.ok) {
      throw new Error(r.status === 429 ? 'The map service is busy. Wait a moment and try again.' : 'The map service is unavailable (' + r.status + ').');
    }
    return await r.json();
  } finally {
    clearTimeout(timer);
  }
}

function photonResults(data) {
  if (!Array.isArray(data.features)) throw new Error('The location service returned an invalid response.');
  return data.features
    .map((f) => {
      const p = f.properties || {};
      const xy = f.geometry?.coordinates;
      return {
        name: p.name || '',
        address: [p.name, [p.housenumber, p.street].filter(Boolean).join(' '), p.district, p.city, p.state, p.postcode, p.country]
          .filter(Boolean)
          .filter((v, i, a) => a.indexOf(v) === i)
          .join(', '),
        lat: Number(xy?.[1]),
        lng: Number(xy?.[0]),
        osmId: p.osm_id,
        osmType: p.osm_type,
        source: 'Photon / OpenStreetMap',
        country: p.countrycode
      };
    })
    .filter((p) => isCoordinate(p));
}

async function searchCampus(query, bias, { fetcher = fetch, endpoint = GEO_SERVICES.search, storage = safeStorage() } = {}) {
  const q = String(query || '').trim();
  if (q.length < 4) throw new Error('Enter the college name and locality, or a full campus address.');
  const url = new URL(endpoint);
  url.searchParams.set('q', q);
  url.searchParams.set('limit', '6');
  url.searchParams.set('lang', 'en');
  if (isCoordinate(bias)) {
    url.searchParams.set('lat', bias.lat);
    url.searchParams.set('lon', bias.lng);
  }
  const key = url.href;
  if (searchCache.has(key)) return searchCache.get(key);
  try {
    const cached = JSON.parse(storage?.getItem('campusroute.search.' + key) || 'null');
    if (cached && Date.now() - cached.at < 30 * 86400000) {
      searchCache.set(key, cached.results);
      return cached.results;
    }
  } catch {
    /* ignore unreadable cache */
  }
  // One request a second, at most, to stay a good citizen of a free service.
  const delay = Math.max(0, lastSearch + 1100 - Date.now());
  lastSearch = Date.now() + delay;
  await new Promise((r) => setTimeout(r, delay));

  const results = photonResults(await fetchJSON(url.href, fetcher));
  searchCache.set(key, results);
  try {
    storage?.setItem('campusroute.search.' + key, JSON.stringify({ at: Date.now(), results }));
  } catch {
    /* cache is a convenience, never a requirement */
  }
  return results;
}

async function fetchRoadMatrix(points, { fetcher = fetch, endpoint = GEO_SERVICES.routing } = {}) {
  const unique = [...new Map(points.map((p) => [pointKey(p), p])).values()];
  if (unique.length < 2 || unique.length > 100) throw new Error('Road routing needs 2–100 unique locations.');
  const delay = Math.max(0, lastRoute + 1100 - Date.now());
  lastRoute = Date.now() + delay;
  await new Promise((r) => setTimeout(r, delay));
  const url = endpoint.replace(/\/$/, '') + '/table/v1/driving/' + unique.map(pointKey).join(';') + '?annotations=duration,distance';
  return parseRoadMatrix(await fetchJSON(url, fetcher), unique);
}

// localStorage throws outright in some embedded contexts, so never touch it raw.
function safeStorage() {
  try {
    const s = globalThis.localStorage;
    s?.getItem('campusroute.probe');
    return s || null;
  } catch {
    return null;
  }
}

// ---- engine.js ----
// CampusRoute planning engine.
//
// Every internal time is a number of hours since the Unix epoch, interpreted as
// Indian local wall time on a UTC-shaped calendar: a visit at 09:00 IST is
// stored as `Date.parse('2026-09-24T09:00:00Z') / 3600000`. That keeps day
// boundaries, overnight rest and daily windows arithmetic-simple, and it means
// no calculation here depends on the viewer's own time zone.
//
// Nothing in this file talks to a network. Travel times are model estimates
// built from coordinates, a cached road matrix and the assumptions the user
// sets — no live traffic, fares, flight availability or train timetables are
// implied anywhere.

const DEFAULT_SETTINGS = {
  priority: 'balanced', // 'balanced' | 'teams' | 'time'
  roadSpeed: 55,        // km/h average, used when there is no road matrix
  roadFactor: 1.3,      // straight-line km -> road km
  airportBuffer: 2,     // hours lost to check-in, security and baggage, both ends
  buffer: 0.5,          // hours of transfer slack before and after each visit
  dayStart: 6,          // earliest hour travel may start
  dayEnd: 22,           // latest hour travel may end
  maxTravel: 12,        // most hours of travelling in one day
  maxDuty: 16,          // most hours of travel + visits in one day
  rest: 9,              // hours of rest between the end of one day and the next
  maxNights: 8          // most consecutive nights away per route
};

const SETTING_LIMITS = {
  roadSpeed: [20, 100],
  roadFactor: [1, 2],
  airportBuffer: [0, 6],
  buffer: [0, 3],
  dayStart: [0, 12],
  dayEnd: [12, 24],
  maxTravel: [1, 24],
  maxDuty: [1, 24],
  rest: [0, 14],
  maxNights: [0, 30]
};

const MAX_COLLEGES = 1000;
const MAX_DATED_VISITS = 60;
const MAX_TEAMS = 20;

// ---------------------------------------------------------------------------
// Small shared helpers
// ---------------------------------------------------------------------------

const hourOf = (visit) => Date.parse(visit.date + 'T' + visit.time + ':00Z') / 3600000;
const dayOf = (hours) => Math.floor(hours / 24);
const isoDay = (hours) => new Date(dayOf(hours) * 86400000).toISOString().slice(0, 10);
const legKey = (a, b) => a + ' → ' + b;
const locationsOf = (state) => ({ ...CITIES, ...state.locations });
const teamBase = (team, state) => team.base || state.base;
const locationName = (college) =>
  (college.city || '').trim() || (college.name || '').trim() || (college.location?.address || '').trim() || 'Campus';

function haversine(a, b) {
  const r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r;
  const dLng = (b.lng - a.lng) * r;
  const q = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 6371 * 2 * Math.atan2(Math.sqrt(q), Math.sqrt(Math.max(0, 1 - q)));
}

function formatHours(n) {
  if (!Number.isFinite(n)) return 'Unavailable';
  const minutes = Math.round(n * 60);
  const parts = [Math.floor(minutes / 60) ? Math.floor(minutes / 60) + 'h' : '', minutes % 60 ? (minutes % 60) + 'm' : ''];
  return parts.filter(Boolean).join(' ') || '0m';
}

function dateText(hours, options = { day: 'numeric', month: 'short' }) {
  return new Intl.DateTimeFormat('en-GB', { ...options, timeZone: 'UTC' }).format(new Date(hours * 3600000));
}

const timeText = (hours) => dateText(hours, { hour: '2-digit', minute: '2-digit', hour12: false });

// ---------------------------------------------------------------------------
// Visits
// ---------------------------------------------------------------------------

// A college row can carry two dated visits: the assessment and an optional
// interview round. Planning works on visits, never on college rows.
function scheduledVisits(state) {
  return state.colleges.flatMap((c) => [
    ...(c.date ? [{ ...c, sourceCollegeId: c.id, visitType: 'assessment' }] : []),
    ...(c.interviewDate
      ? [{
          ...c,
          id: JSON.stringify(['interview', c.id]),
          sourceCollegeId: c.id,
          visitType: 'interview',
          date: c.interviewDate,
          time: c.interviewTime || '09:00',
          duration: c.interviewDuration ?? c.duration ?? 6
        }]
      : [])
  ]);
}

// When named people from different teams are assigned to one visit, that visit
// becomes several travelling parties: each team travels its own route, plus one
// automatic party for any unfilled headcount.
function travelVisits(state) {
  return scheduledVisits(state).flatMap((visit) => {
    const groups = new Map();
    for (const name of visit.assignedMembers || []) {
      const owner = state.teams.find((t) => t.members?.includes(name));
      if (!owner) continue;
      if (!groups.has(owner.id)) groups.set(owner.id, []);
      groups.get(owner.id).push(name);
    }
    if (groups.size <= 1) return [{ ...visit, ...(groups.size ? { team: [...groups.keys()][0] } : {}) }];

    const parts = [...groups].map(([team, names]) => ({
      ...visit,
      id: JSON.stringify(['party', visit.id, team]),
      planningVisitId: visit.id,
      sourceCollegeId: visit.sourceCollegeId || visit.id,
      team,
      requiredPeople: names.length,
      assignedMembers: names
    }));
    const remainder = (visit.requiredPeople ?? visit.assignedMembers.length) - visit.assignedMembers.length;
    if (remainder > 0) {
      parts.push({
        ...visit,
        id: JSON.stringify(['party', visit.id, 'auto']),
        planningVisitId: visit.id,
        sourceCollegeId: visit.sourceCollegeId || visit.id,
        team: 'auto',
        requiredPeople: remainder,
        assignedMembers: []
      });
    }
    return parts;
  });
}

// ---------------------------------------------------------------------------
// Places: cities, confirmed campus pins and airports
// ---------------------------------------------------------------------------

function airportPoint(code, state) {
  if (!code) return null;
  const p = state.airportPins?.[code] || AIRPORTS[code];
  return p ? { ...p, id: 'airport:' + code, label: code + ' airport', kind: 'airport', code } : null;
}

function nearestAirport(point, state) {
  let best = null;
  let bestDistance = Infinity;
  for (const code of Object.keys(AIRPORTS)) {
    const p = airportPoint(code, state);
    if (!p) continue;
    const distance = haversine(point, p);
    if (distance < bestDistance) {
      bestDistance = distance;
      best = code;
    }
  }
  return best;
}

// Resolve either a city name or a college row into a routing point.
function endpoint(value, state) {
  const cities = locationsOf(state);
  if (typeof value === 'object' && hasCampus(value)) {
    const requested =
      value.airport === 'none' ? null
      : value.airport && value.airport !== 'auto' ? value.airport
      : nearestAirport(value.location, state);
    // An airport code that is not in the reference list is treated as "no air
    // option" rather than as a crash waiting to happen.
    const airport = airportPoint(requested, state) ? requested : null;
    return {
      ...value.location,
      id: 'campus:' + (value.sourceCollegeId || value.id),
      label: value.name,
      city: locationName(value),
      kind: 'campus',
      airport,
      airportStamp: airport ? airport + '@' + pointKey(airportPoint(airport, state)) : 'none'
    };
  }
  const name = typeof value === 'string' ? value : value.city;
  const p = cities[name];
  if (!p) throw new Error('Unknown location: ' + (name || '(none)'));
  const airport = airportPoint(p.airport, state) ? p.airport : null;
  return {
    ...p,
    id: 'city:' + name,
    label: name,
    city: name,
    kind: 'city',
    airport,
    airportStamp: airport ? airport + '@' + pointKey(airportPoint(airport, state)) : 'none'
  };
}

// Every point a road matrix needs to cover: team bases, pinned dated campuses
// and the airports those points would fly from.
function routingPoints(state) {
  const bases = [...new Set([state.base, ...state.teams.map((t) => teamBase(t, state))])];
  const points = [
    ...bases.map((b) => endpoint(b, state)),
    ...state.colleges.filter((c) => (c.date || c.interviewDate) && (hasCampus(c) || isDemo(c))).map((c) => endpoint(c, state))
  ];
  for (const code of new Set(points.map((p) => p.airport).filter(Boolean))) {
    const p = airportPoint(code, state);
    if (p) points.push(p);
  }
  return [...new Map(points.map((p) => [pointKey(p), p])).values()];
}

// Overrides are keyed by the exact points they were measured between, so moving
// a pin or switching airport quietly retires the stale manual estimate instead
// of applying it to a different journey.
const overrideStamp = (p) => p.id + '@' + pointKey(p) + '#' + (p.airportStamp || 'none');
const exactLegKey = (a, b) =>
  a.kind === 'city' && b.kind === 'city' ? legKey(a.label, b.label) : legKey(overrideStamp(a), overrideStamp(b));

// ---------------------------------------------------------------------------
// Travel estimates
// ---------------------------------------------------------------------------

// A 15-minute break every 200 km keeps long road legs honest.
const roadBreaks = (km) => 0.25 * Math.floor(km / 200);

function groundTravel(a, b, state) {
  const settings = state.settings;
  const measured = networkRoad(a, b, state);
  if (measured?.unreachable) return { hours: null, distance: null, source: 'unreachable' };
  if (measured) return { ...measured, hours: Math.max(1 / 60, measured.hours) + roadBreaks(measured.distance) };
  const distance = haversine(a, b) * settings.roadFactor;
  return {
    hours: Math.max(1 / 60, distance / settings.roadSpeed + roadBreaks(distance)),
    distance,
    source: 'coordinate-estimate'
  };
}

// Road, air and rail estimates for one direction of one leg, plus whichever
// mode the plan should use. `state.overrides[key]` wins over every model value.
function legOptions(from, to, state) {
  const a = endpoint(from, state);
  const b = endpoint(to, state);
  const settings = state.settings;
  const precise = a.kind === 'campus' || b.kind === 'campus';
  const same = a.id === b.id;
  const straight = haversine(a, b);
  const distance = same ? 12 : straight * settings.roadFactor;

  const flightPossible = !same && !!a.airport && !!b.airport && a.airport !== b.airport;
  const airportA = airportPoint(a.airport, state) || a;
  const airportB = airportPoint(b.airport, state) || b;
  const flightHours = flightPossible ? haversine(airportA, airportB) / 650 + 0.5 : null;

  const key = exactLegKey(a, b);
  const override = state.overrides[key] || {};

  const ground = precise
    ? groundTravel(a, b, state)
    : { hours: same ? 0.5 : Math.max(0.75, distance / settings.roadSpeed + roadBreaks(distance)), distance, source: 'city-estimate' };

  // Getting to and from the airports: measured when both ends are pinned,
  // otherwise the city-level access time.
  const departure = flightPossible
    ? precise ? groundTravel(a, airportA, state) : { hours: a.access ?? 1, distance: null, source: 'city-estimate' }
    : null;
  const arrival = flightPossible
    ? precise ? groundTravel(airportB, b, state) : { hours: b.access ?? 1, distance: null, source: 'city-estimate' }
    : null;

  const road = override.road ?? ground.hours;
  const air =
    override.air === null ? null
    : override.air ?? (flightPossible && Number.isFinite(departure.hours) && Number.isFinite(arrival.hours)
        ? flightHours + settings.airportBuffer + departure.hours + arrival.hours
        : null);
  const airDistance =
    flightPossible && Number.isFinite(departure?.distance) && Number.isFinite(arrival?.distance)
      ? haversine(airportA, airportB) + departure.distance + arrival.distance
      : null;

  const rail = override.rail || null;
  const train = rail ? rail.hours + rail.departureHours + rail.arrivalHours + rail.buffer : null;
  const trainDistance = rail ? rail.km + rail.departureKm + rail.arrivalKm : null;
  const trainShorter =
    !!rail && [override.distance ?? ground.distance, air !== null ? airDistance : null]
      .some((d) => Number.isFinite(d) && trainDistance < d);

  const preferred = override.mode || 'auto';
  let mode = preferred === 'auto' ? (air !== null && (road === null || air + 0.75 < road) ? 'air' : 'road') : preferred;
  // Rail only wins automatically when it is both shorter on the ground and
  // quicker than the mode that would otherwise be chosen.
  if (preferred === 'auto' && trainShorter && (mode === 'air' ? train < air : road === null || train < road)) mode = 'train';

  return {
    from: a.label, to: b.label, fromCity: a.city, toCity: b.city, fromPoint: a, toPoint: b,
    key, reverseKey: exactLegKey(b, a),
    road, air, rail, train, trainDistance, trainShorter, airDistance,
    distance: override.distance ?? ground.distance,
    mode,
    hours: mode === 'train' ? train : mode === 'air' ? air : road,
    custom: Object.keys(override).length > 0,
    airports: flightPossible ? a.airport + '–' + b.airport : null,
    flightHours, precise,
    roadSource: override.road !== undefined ? 'manual' : ground.source,
    airSource: override.air !== undefined ? 'manual' : precise ? 'campus-transfers' : 'city-estimate',
    ground, departure, arrival, airportA, airportB, airportBuffer: settings.airportBuffer
  };
}

// ---------------------------------------------------------------------------
// Validation. Everything the UI and the API both refuse to store.
// ---------------------------------------------------------------------------

function validateState(state) {
  const errors = [];
  if (!state || state.schema !== 1) return ['Unsupported plan file.'];
  if (!state.settings || !state.locations || !state.overrides || !Array.isArray(state.colleges) || !Array.isArray(state.teams)) {
    return ['The plan is missing required fields.'];
  }
  const cities = locationsOf(state);
  if (!Object.hasOwn(cities, state.base)) errors.push('The default base must be a known city.');

  const s = state.settings;
  for (const [key, [min, max]] of Object.entries(SETTING_LIMITS)) {
    if (!Number.isFinite(s[key]) || s[key] < min || s[key] > max) errors.push(`Invalid assumption: ${key} (${min}–${max}).`);
  }
  if (Number.isFinite(s.dayStart) && Number.isFinite(s.dayEnd) && s.dayEnd - s.dayStart < 1) {
    errors.push('The daily window must be at least one hour long.');
  }
  if (!['balanced', 'teams', 'time'].includes(s.priority)) errors.push('Unknown routing priority.');

  if (state.colleges.length > MAX_COLLEGES) errors.push(`Use up to ${MAX_COLLEGES} colleges in the list.`);
  if (scheduledVisits(state).length > MAX_DATED_VISITS) {
    errors.push(`Schedule up to ${MAX_DATED_VISITS} dated visits at a time; undated colleges stay in the list.`);
  }
  if (state.teams.length < 1 || state.teams.length > MAX_TEAMS) errors.push(`Add between 1 and ${MAX_TEAMS} teams.`);

  const teamIds = new Set();
  for (const t of state.teams) {
    if (!t.id || teamIds.has(t.id) || typeof t.name !== 'string' || !t.name.trim() || !Number.isInteger(t.size) || t.size < 1 || t.size > 10000) {
      errors.push('Every team needs a unique ID, a name and at least one person.');
    }
    if (t.base !== undefined && !Object.hasOwn(cities, t.base)) errors.push('Every team base must be a known city.');
    teamIds.add(t.id);
  }

  for (const [name, l] of Object.entries(state.locations)) {
    if (!name.trim() || !l || !isCoordinate(l) || Object.hasOwn(CITIES, name)) errors.push('Invalid custom city: ' + name + '.');
  }

  // Named people belong to exactly one team, so a person is never double-booked
  // by two teams travelling at the same time.
  const memberNames = new Set();
  for (const t of state.teams) {
    if (t.members === undefined) continue;
    if (!Array.isArray(t.members) || t.members.length > t.size) {
      errors.push('Named members cannot exceed the team size.');
      continue;
    }
    for (const name of t.members) {
      if (typeof name !== 'string' || !name.trim() || name.trim().length > 80) {
        errors.push('Each member needs a name of 1–80 characters.');
        continue;
      }
      const key = name.trim().replace(/\s+/g, ' ').toLowerCase();
      if (memberNames.has(key)) errors.push('Each member must belong to one team. Use distinct names or initials.');
      memberNames.add(key);
    }
    if (t.memberAvailability !== undefined) {
      if (!t.memberAvailability || typeof t.memberAvailability !== 'object' || Array.isArray(t.memberAvailability)) {
        errors.push('Invalid member availability.');
        continue;
      }
      for (const [name, rule] of Object.entries(t.memberAvailability)) {
        if (!t.members?.includes(name) || !rule || typeof rule.available !== 'boolean' || !Array.isArray(rule.unavailable)) {
          errors.push('Member availability must belong to a named team member.');
          continue;
        }
        for (const range of rule.unavailable) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(range.from) || !/^\d{4}-\d{2}-\d{2}$/.test(range.to) || range.from > range.to) {
            errors.push('Enter valid unavailable from/to dates for ' + name + '.');
          }
        }
      }
    }
  }

  if (state.network && !validateMatrix(state.network)) errors.push('Invalid cached road matrix. Refresh road calculations.');
  if (state.airportPins) {
    for (const [code, p] of Object.entries(state.airportPins)) {
      if (!Object.hasOwn(AIRPORTS, code) || !isCoordinate(p)) errors.push('Invalid airport access pin: ' + code + '.');
    }
  }

  const ids = new Set();
  for (const c of state.colleges) {
    const title = typeof c.name === 'string' && c.name.trim() ? c.name : 'Unnamed college';
    if (!c.id || ids.has(c.id)) errors.push('College IDs must be unique.');
    ids.add(c.id);
    if (typeof c.name !== 'string' || !c.name.trim()) errors.push('A college name is required.');
    if (c.city && !Object.hasOwn(cities, c.city)) errors.push(title + ': choose a known city or clear the city.');
    if (!c.city && !c.location) errors.push(title + ': set a city or a campus pin.');
    if (c.location && (!isCoordinate(c.location) || typeof c.location.confirmed !== 'boolean')) {
      errors.push(title + ': enter valid campus coordinates and confirm the location.');
    }
    if (c.airport && !['auto', 'none'].includes(c.airport) && !Object.hasOwn(AIRPORTS, c.airport)) {
      errors.push(title + ': select a supported airport.');
    }
    if (c.date) {
      const h = hourOf(c);
      const validDate = /^\d{4}-\d{2}-\d{2}$/.test(c.date) && Number.isFinite(h) && new Date(h * 3600000).toISOString().slice(0, 10) === c.date;
      if (!validDate || !/^([01]\d|2[0-3]):[0-5]\d$/.test(c.time)) errors.push(title + ': enter a valid date and start time.');
    }
    if (!Number.isFinite(c.duration) || c.duration < 0.5 || c.duration > 12) errors.push(title + ': duration must be 0.5–12 hours.');
    if (c.interviewDate) {
      const visit = { date: c.interviewDate, time: c.interviewTime || '09:00' };
      const h = hourOf(visit);
      const duration = c.interviewDuration ?? c.duration ?? 6;
      const valid = /^\d{4}-\d{2}-\d{2}$/.test(visit.date) && Number.isFinite(h) &&
        new Date(h * 3600000).toISOString().slice(0, 10) === visit.date && /^([01]\d|2[0-3]):[0-5]\d$/.test(visit.time);
      if (!valid) errors.push(title + ': enter a valid interview date and start time.');
      if (!Number.isFinite(duration) || duration < 0.5 || duration > 12) errors.push(title + ': interview duration must be 0.5–12 hours.');
    }
    if (c.team !== 'auto' && !teamIds.has(c.team)) errors.push(title + ': assigned team no longer exists.');
    if (c.requiredPeople !== undefined && (!Number.isInteger(c.requiredPeople) || c.requiredPeople < 1 || c.requiredPeople > 10000)) {
      errors.push('College staffing must be a positive whole number.');
    }
    if (c.assignedMembers !== undefined) {
      if (!Array.isArray(c.assignedMembers) || c.assignedMembers.some((n) => typeof n !== 'string')) {
        errors.push('Invalid college member assignments.');
        continue;
      }
      if (new Set(c.assignedMembers).size !== c.assignedMembers.length) errors.push('A person is assigned twice to a college.');
      if (c.requiredPeople !== undefined && c.assignedMembers.length > c.requiredPeople) {
        errors.push('Selected members exceed the college headcount.');
      }
      if (c.assignedMembers.some((n) => !state.teams.some((t) => t.members?.includes(n)))) {
        errors.push('A selected college member no longer exists. Edit the college assignment.');
      }
    }
  }

  for (const [key, o] of Object.entries(state.overrides)) {
    if (!o || !['auto', 'road', 'air', 'train'].includes(o.mode || 'auto')) {
      errors.push('Invalid leg preference: ' + key);
      continue;
    }
    if (o.mode === 'train' && !o.rail) errors.push('Enter a train itinerary before selecting train: ' + key);
    if (o.rail) {
      const r = o.rail;
      if (typeof r.fromStation !== 'string' || !r.fromStation.trim() || typeof r.toStation !== 'string' || !r.toStation.trim()) {
        errors.push('Enter both train stations: ' + key);
      }
      for (const f of ['hours', 'km', 'departureHours', 'arrivalHours', 'departureKm', 'arrivalKm', 'buffer']) {
        const min = f === 'hours' || f === 'km' ? 0.01 : 0;
        const max = f.toLowerCase().includes('km') ? 15000 : 100;
        if (!Number.isFinite(r[f]) || r[f] < min || r[f] > max) errors.push('Invalid train ' + f + ': ' + key);
      }
    }
    for (const f of ['road', 'air', 'distance']) {
      if (o[f] === undefined) continue;
      if (f === 'air' && o[f] === null) continue;
      if (!Number.isFinite(o[f]) || o[f] <= 0 || o[f] > (f === 'distance' ? 15000 : 100)) {
        errors.push('Invalid ' + f + ' estimate for ' + key + '.');
      }
    }
  }

  return [...new Set(errors)];
}

// ---------------------------------------------------------------------------
// Placing travel into the working day
// ---------------------------------------------------------------------------

function ledgerFor(ledger, day) {
  if (!ledger[day]) ledger[day] = { travel: 0, duty: 0 };
  return ledger[day];
}

function addLedger(ledger, start, end, type) {
  const entry = ledgerFor(ledger, dayOf(start));
  entry.duty += end - start;
  if (type === 'travel') entry.travel += end - start;
}

// How many more hours of travel a given day can absorb.
function travelRoom(ledger, day, s) {
  const used = ledgerFor(ledger, day);
  return Math.max(0, Math.min(s.maxTravel - used.travel, s.maxDuty - used.duty));
}

// Walk a leg forward from `start`, splitting it across days when it is a road
// journey. Air and train itineraries stay whole: half a flight is not a thing.
function forwardTravel(leg, start, ledger, s, deadline = Infinity) {
  const out = [];
  let remaining = leg.hours;
  let t = start;
  for (let guard = 0; remaining > 1e-7 && guard < 200; guard++) {
    const day = dayOf(t);
    t = Math.max(t, day * 24 + s.dayStart);
    if (dayOf(t) !== day) continue;
    const cap = Math.min(day * 24 + s.dayEnd - t, deadline - t, travelRoom(ledger, day, s));
    if (cap < 1e-7 || (leg.mode !== 'road' && cap + 1e-7 < remaining)) {
      if ((day + 1) * 24 + s.dayStart >= deadline) return null;
      t = (day + 1) * 24 + s.dayStart;
      continue;
    }
    const hours = Math.min(remaining, cap);
    const end = t + hours;
    const done = remaining - hours < 1e-7;
    out.push({
      type: 'travel',
      start: t,
      end,
      leg,
      from: out.length ? 'En route' : leg.from,
      to: done ? leg.to : 'En route',
      toCity: done ? leg.toCity : 'En route',
      part: out.length + 1
    });
    addLedger(ledger, t, end, 'travel');
    remaining -= hours;
    t = (day + 1) * 24 + s.dayStart;
  }
  return remaining > 1e-7 ? null : out;
}

// Walk the outbound leg backwards from the moment the team must already be at
// the first campus, so departure is as late as the working day allows.
function outboundTravel(leg, deadline, ledger, s) {
  const out = [];
  let remaining = leg.hours;
  let end = deadline;
  for (let guard = 0; remaining > 1e-7 && guard < 200; guard++) {
    const day = dayOf(end);
    end = Math.min(end, day * 24 + s.dayEnd);
    const cap = Math.min(end - (day * 24 + s.dayStart), travelRoom(ledger, day, s));
    if (cap < 1e-7 || (leg.mode !== 'road' && cap + 1e-7 < remaining)) {
      end = day * 24 + s.dayEnd - 24;
      continue;
    }
    const hours = Math.min(remaining, cap);
    const start = end - hours;
    const done = remaining - hours < 1e-7;
    out.unshift({
      type: 'travel',
      start,
      end,
      leg,
      from: done ? leg.from : 'En route',
      to: out.length ? 'En route' : leg.to,
      toCity: out.length ? 'En route' : leg.toCity
    });
    addLedger(ledger, start, end, 'travel');
    remaining -= hours;
    end = day * 24 + s.dayEnd - 24;
  }
  return remaining > 1e-7 ? null : out.map((e, i) => ({ ...e, part: i + 1 }));
}

// Rest between days and no overlap inside a day.
function validateEvents(events, s) {
  const days = new Map();
  for (const e of events) {
    const d = dayOf(e.start);
    if (!days.has(d)) days.set(d, []);
    days.get(d).push(e);
  }
  let lastEnd = null;
  for (const [, dayEvents] of [...days].sort((a, b) => a[0] - b[0])) {
    dayEvents.sort((a, b) => a.start - b.start);
    if (lastEnd !== null && dayEvents[0].start - lastEnd < s.rest - 1e-7) return 'Insufficient overnight rest between days.';
    for (let i = 1; i < dayEvents.length; i++) {
      if (dayEvents[i].start < dayEvents[i - 1].end - 1e-7) return 'Travel overlaps a visit.';
    }
    lastEnd = dayEvents.at(-1).end;
  }
  return null;
}

// ---------------------------------------------------------------------------
// Member availability
// ---------------------------------------------------------------------------

function memberTravelAvailability(team, name, start = -Infinity, end = Infinity) {
  const rule = team.memberAvailability?.[name];
  if (!rule) return { available: true, reason: 'Available' };
  if (rule.available === false) return { available: false, reason: 'Marked unavailable for travel' };
  const from = Number.isFinite(start) ? isoDay(start) : null;
  const to = Number.isFinite(end) ? isoDay(Math.max(start, end - 1e-7)) : null;
  const conflict = (rule.unavailable || []).find((r) => from && to && r.from <= to && r.to >= from);
  return conflict ? { available: false, reason: `Unavailable ${conflict.from} to ${conflict.to}` } : { available: true, reason: 'Available' };
}

// ---------------------------------------------------------------------------
// Building one route
// ---------------------------------------------------------------------------

// Visits are date-fixed, so a route is a chronological chain: base -> visits in
// date order -> base. Feasibility is about whether the travel in between fits.
function buildRouteFromBase(colleges, state) {
  const s = state.settings;
  const stops = [...colleges].sort((a, b) => hourOf(a) - hourOf(b) || a.id.localeCompare(b.id));
  if (!stops.length) return { feasible: false, reason: 'No visits.' };
  if (stops.some((c) => !isDemo(c) && !hasCampus(c) && !c.city)) {
    return { feasible: false, reason: 'Confirm this campus location before calculating travel.' };
  }
  const fixed = [...new Set(stops.filter((c) => c.team !== 'auto').map((c) => c.team))];
  if (fixed.length > 1) return { feasible: false, reason: 'Different fixed team assignments.' };
  for (let i = 1; i < stops.length; i++) {
    if (hourOf(stops[i]) < hourOf(stops[i - 1]) + stops[i - 1].duration + s.buffer) {
      return { feasible: false, reason: 'Visit times overlap or leave no transfer buffer.' };
    }
  }

  const ledger = {};
  const events = stops.map((c) => ({
    type: c.visitType || 'assessment',
    start: hourOf(c),
    end: hourOf(c) + c.duration,
    college: c,
    to: locationName(c)
  }));
  for (const e of events) addLedger(ledger, e.start, e.end, 'visit');

  const legs = [];
  const outbound = legOptions(state.base, stops[0], state);
  legs.push(outbound);
  if (!Number.isFinite(outbound.hours)) {
    return { feasible: false, reason: 'No usable road or air route to this campus. Check the pins or enter a verified leg duration.' };
  }
  const pre = outboundTravel(outbound, hourOf(stops[0]) - s.buffer, ledger, s);
  if (!pre) return { feasible: false, reason: 'Outbound travel cannot fit within the daily limits.' };
  events.push(...pre);

  for (let i = 1; i < stops.length; i++) {
    const leg = legOptions(stops[i - 1], stops[i], state);
    legs.push(leg);
    if (!Number.isFinite(leg.hours)) return { feasible: false, reason: 'A leg between visits has no travel estimate.' };
    const start = hourOf(stops[i - 1]) + stops[i - 1].duration + s.buffer;
    const deadline = hourOf(stops[i]) - s.buffer;
    const trip = forwardTravel(leg, start, ledger, s, deadline);
    if (!trip || trip.at(-1).end > deadline + 1e-7) return { feasible: false, reason: 'Not enough travel time between visits.' };
    events.push(...trip);
  }

  const last = stops.at(-1);
  const back = legOptions(last, state.base, state);
  legs.push(back);
  if (!Number.isFinite(back.hours)) return { feasible: false, reason: 'The return leg has no travel estimate.' };
  let ret = forwardTravel(back, hourOf(last) + last.duration + s.buffer, ledger, s);
  if (!ret) return { feasible: false, reason: 'Return travel cannot fit within the daily limits.' };
  events.push(...ret);
  events.sort((a, b) => a.start - b.start);

  // The return journey is the only flexible piece: if the day is already too
  // long, or rest would be short, push it to the next morning and retry once.
  let issue = validateEvents(events, s);
  if (issue && ret[0].start >= hourOf(last) + last.duration) {
    for (const e of ret) {
      const entry = ledgerFor(ledger, dayOf(e.start));
      entry.travel -= e.end - e.start;
      entry.duty -= e.end - e.start;
      events.splice(events.indexOf(e), 1);
    }
    const previousEnd = events.at(-1).end;
    const again = forwardTravel(back, Math.max((dayOf(previousEnd) + 1) * 24 + s.dayStart, previousEnd + s.rest), ledger, s);
    if (!again) return { feasible: false, reason: issue };
    ret = again;
    events.push(...again);
    events.sort((a, b) => a.start - b.start);
    issue = validateEvents(events, s);
  }
  if (issue) return { feasible: false, reason: issue };

  const start = events[0].start;
  const end = events.at(-1).end;
  const overnights = [];
  for (let d = dayOf(start); d < dayOf(end); d++) {
    const before = events.filter((e) => e.end <= (d + 1) * 24).at(-1);
    const city = before?.toCity || before?.to || state.base;
    if (city !== state.base) overnights.push({ day: d, city, start: (d + 1) * 24 - 0.01, end: (d + 1) * 24 + 0.01, type: 'overnight' });
  }
  if (overnights.length > s.maxNights) {
    return { feasible: false, reason: `This grouping needs ${overnights.length} nights away; the limit is ${s.maxNights}.` };
  }

  return {
    feasible: true,
    stops, legs, events, overnights,
    start, end,
    nights: overnights.length,
    hours: legs.reduce((n, l) => n + l.hours, 0),
    roadHours: legs.reduce((n, l) => n + (l.road || 0), 0),
    distance: legs.reduce((n, l) => n + (l.distance || 0), 0),
    fixedTeam: fixed[0] || null
  };
}

// Try the candidate teams' bases and keep the cheapest feasible attempt.
function buildRoute(colleges, state, team = null) {
  const fixed = [...new Set(colleges.filter((c) => c.team !== 'auto').map((c) => c.team))];
  if (fixed.length > 1) return { feasible: false, reason: 'Different fixed team assignments.' };

  const signature = (c) => JSON.stringify([c.requiredPeople ?? null, [...(c.assignedMembers || [])].sort()]);
  if (new Set(colleges.map(signature)).size > 1) {
    return { feasible: false, reason: 'Different visit staffing requirements need separate travelling parties.' };
  }

  const requiredMembers = colleges[0]?.assignedMembers || [];
  const requiredPeople = colleges[0]?.requiredPeople;
  const candidates = (team ? [team] : state.teams.filter((t) => !fixed.length || t.id === fixed[0])).filter(
    (t) => (requiredPeople === undefined || t.size >= requiredPeople) && requiredMembers.every((n) => t.members?.includes(n))
  );

  const attempts = candidates.map((t) => ({
    ...buildRouteFromBase(colleges, { ...state, base: teamBase(t, state) }),
    base: teamBase(t, state),
    candidateTeam: t.id,
    size: requiredPeople ?? t.size,
    requiredMembers
  }));

  return (
    attempts.filter((r) => r.feasible).sort((a, b) => routeScore(a, state) - routeScore(b, state) || a.candidateTeam.localeCompare(b.candidateTeam))[0] ||
    attempts[0] || { feasible: false, reason: 'No team has enough people, or the selected members, for this visit.' }
  );
}

// Lower is better. `tour` is the fixed cost of sending anyone anywhere at all,
// which is what makes merging two routes worthwhile.
function routeScore(route, state) {
  const minSize = Math.min(...state.teams.map((t) => t.size));
  const size = route.size || state.teams.find((t) => t.id === route.fixedTeam)?.size || minSize;
  const w =
    state.settings.priority === 'teams' ? { travel: 0.5, night: 1, tour: 25 }
    : state.settings.priority === 'time' ? { travel: 1, night: 0.25, tour: 0 }
    : { travel: 1, night: 1.5, tour: 6 };
  return route.hours * size * w.travel + route.nights * size * w.night + w.tour;
}

// ---------------------------------------------------------------------------
// Planning every visit
// ---------------------------------------------------------------------------

function planRoutes(state) {
  const errors = validateState(state);
  if (errors.length) return { errors, routes: [], unplaced: [], warnings: [] };

  let routes = [];
  const unplaced = [];
  for (const visit of travelVisits(state)) {
    const route = buildRoute([visit], state);
    if (route.feasible) routes.push(route);
    else unplaced.push({ college: visit, reason: route.reason });
  }

  // Deterministic savings heuristic: repeatedly merge the pair of routes whose
  // combined trip saves the most weighted cost. Dates are fixed, so a merge is
  // only ever a chronological chain — and only accepted when it stays feasible.
  // This is a good local search, not a proven global optimum.
  let changed = true;
  while (changed) {
    changed = false;
    let best = null;
    let bestGain = 1e-6;
    for (let i = 0; i < routes.length; i++) {
      for (let j = i + 1; j < routes.length; j++) {
        const merged = buildRoute([...routes[i].stops, ...routes[j].stops], state);
        if (!merged.feasible) continue;
        const gain = routeScore(routes[i], state) + routeScore(routes[j], state) - routeScore(merged, state);
        if (gain > bestGain) {
          bestGain = gain;
          best = { i, j, route: merged };
        }
      }
    }
    if (best) {
      routes = routes.filter((_, i) => i !== best.i && i !== best.j);
      routes.push(best.route);
      changed = true;
    }
  }

  routes.sort((a, b) => a.start - b.start || a.stops[0].id.localeCompare(b.stops[0].id));

  // Assign teams and people. Explicit assignments are reserved first so
  // automatic work can never displace a person somebody chose by name.
  const reservations = new Map(state.teams.map((t) => [t.id, []]));
  const warnings = [];

  const selectPeople = (team, route) => {
    const slots = Array.from({ length: team.size }, (_, i) => team.members?.[i] || '__unnamed:' + team.id + ':' + i);
    const free = slots.filter(
      (n) =>
        (n.startsWith('__unnamed:') || memberTravelAvailability(team, n, route.start, route.end).available) &&
        reservations.get(team.id).every((x) => !x.personKeys.includes(n) || route.start >= x.end || route.end <= x.start)
    );
    if (!route.requiredMembers.every((n) => free.includes(n))) return null;
    const picked = [...route.requiredMembers, ...free.filter((n) => !route.requiredMembers.includes(n))].slice(0, route.size);
    return picked.length === route.size ? picked : null;
  };

  const order = [...routes].sort(
    (a, b) =>
      Number(!!b.requiredMembers.length) - Number(!!a.requiredMembers.length) ||
      Number(!!b.fixedTeam) - Number(!!a.fixedTeam) ||
      a.start - b.start
  );
  for (const route of order) {
    const candidates = route.fixedTeam
      ? state.teams.filter((t) => t.id === route.fixedTeam)
      : [...state.teams].sort(
          (a, b) => a.size - b.size || reservations.get(b.id).length - reservations.get(a.id).length || a.id.localeCompare(b.id)
        );
    const options = candidates
      .map((team) => ({ team, route: buildRoute(route.stops, state, team) }))
      .map((x) => ({ ...x, people: x.route.feasible ? selectPeople(x.team, x.route) : null }))
      .filter((x) => x.people)
      .sort((a, b) => routeScore(a.route, state) - routeScore(b.route, state) || a.team.id.localeCompare(b.team.id));

    const chosen = options[0];
    if (chosen) {
      Object.assign(route, chosen.route);
      route.teamId = chosen.team.id;
      route.teamName = chosen.team.name;
      route.personKeys = chosen.people;
      route.memberNames = chosen.people.filter((n) => !n.startsWith('__unnamed:'));
      reservations.get(chosen.team.id).push(route);
    } else {
      route.memberNames = [];
      route.personKeys = [];
      route.teamId = null;
      route.teamName = route.fixedTeam
        ? (state.teams.find((t) => t.id === route.fixedTeam)?.name || 'Fixed team') + ' · conflict'
        : 'Needs a team';
      route.size = route.size || Math.min(...state.teams.map((t) => t.size));
      warnings.push(
        route.fixedTeam
          ? 'A fixed team has required people with overlapping travel or too little rest.'
          : 'Not enough available people for all routes; check visit staffing.'
      );
    }
  }

  routes.forEach((r, i) => {
    r.id = 'r' + (i + 1);
    r.number = i + 1;
    r.personHours = r.hours * r.size;
    r.personNights = r.nights * r.size;
  });

  // Baseline: what the same visits would cost as separate base-and-back trips,
  // priced with the same estimates and the same team size.
  const covered = new Set(routes.flatMap((r) => r.stops.map((c) => c.id)));
  const included = travelVisits(state).filter((c) => covered.has(c.id));
  let baselineHours = 0;
  let baselinePersonHours = 0;
  for (const c of included) {
    const route = routes.find((r) => r.stops.some((s) => s.id === c.id));
    const hours = legOptions(route.base, c, state).hours + legOptions(c, route.base, state).hours;
    baselineHours += hours;
    baselinePersonHours += hours * route.size;
  }

  const hours = routes.reduce((n, r) => n + r.hours, 0);
  const personHours = routes.reduce((n, r) => n + r.personHours, 0);

  return {
    errors: [],
    warnings: [...new Set(warnings)],
    routes,
    unplaced,
    metrics: {
      hours,
      personHours,
      baselineHours,
      baselinePersonHours,
      saved: baselineHours - hours,
      savedPersonHours: baselinePersonHours - personHours,
      savePercent: baselinePersonHours ? (100 * (baselinePersonHours - personHours)) / baselinePersonHours : 0,
      nights: routes.reduce((n, r) => n + r.nights, 0),
      personNights: routes.reduce((n, r) => n + r.personNights, 0),
      teams: new Set(routes.filter((r) => r.teamId).map((r) => r.teamId)).size,
      unassigned: routes.filter((r) => !r.teamId).length,
      covered: new Set(included.map((c) => c.planningVisitId || c.id)).size
    }
  };
}

// Re-plan from each candidate base so the cost of the choice is visible.
function compareBases(state, bases) {
  const candidates = bases?.length ? bases : [...new Set([state.base, ...state.teams.map((t) => teamBase(t, state))])];
  return candidates.map((base) => {
    const plan = planRoutes({ ...state, base });
    return { base, ...plan.metrics, routes: plan.routes.length, unplaced: plan.unplaced.length, errors: plan.errors };
  });
}

// Who could actually take one more visit: declared availability first, then
// whether the visit itself is reachable, then clashes with existing routes.
function collegeMemberAvailability(state, college) {
  const others = planRoutes({ ...state, colleges: state.colleges.filter((c) => c.id !== college.id) });
  return state.teams.flatMap((team) =>
    (team.members || []).map((name) => {
      if (!college.date && !college.interviewDate) {
        const declared = memberTravelAvailability(team, name);
        return {
          name,
          teamId: team.id,
          available: declared.available,
          reason: declared.reason === 'Available' ? 'Add dates to check travel availability' : declared.reason
        };
      }
      const candidate = { ...college, team: team.id, requiredPeople: 1, assignedMembers: [name] };
      const draft = buildRoute([candidate], state, team);
      const declared = draft.feasible ? memberTravelAvailability(team, name, draft.start, draft.end) : null;
      if (declared && !declared.available) return { name, teamId: team.id, available: false, reason: declared.reason };

      const proposed = planRoutes({ ...state, teams: [team], colleges: [candidate] });
      if (proposed.errors.length || proposed.unplaced.length || proposed.routes.some((r) => !r.teamId)) {
        return { name, teamId: team.id, available: false, reason: proposed.unplaced[0]?.reason || 'Visit and travel cannot fit from this base' };
      }
      const booked = others.routes.filter((r) => r.memberNames?.includes(name));
      const conflict = booked.find((a) => proposed.routes.some((b) => !(b.start >= a.end || b.end <= a.start)));
      return {
        name,
        teamId: team.id,
        available: !conflict,
        reason: conflict
          ? `Busy: ${conflict.stops[0].name}, ${dateText(conflict.start)} ${timeText(conflict.start)} – ${dateText(conflict.end)} ${timeText(conflict.end)}`
          : 'Available for these visits and travel'
      };
    })
  );
}
