const normalise = (s) => String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();

// Airport names arrive from imported spreadsheets in every possible spelling.
// Match a code or a full published name exactly — and never fuzzily, because
// two airports with similar names must not silently share a pin.
const AIRPORT_INDEX = new Map(
  Object.entries(AIRPORTS).flatMap(([code, a]) => [
    [normalise(code), code],
    [normalise(a.name), code],
    [normalise(a.city + ' airport'), code]
  ])
);

function matchAirport(text) {
  return AIRPORT_INDEX.get(normalise(text)) || null;
}

// Check the free-text airport reference an import may have carried along.
function validateCollegeAirport(college) {
  const supplied = college.airportReference;
  if (!supplied) return null;
  const code = matchAirport(supplied);
  return code
    ? { matched: true, code, name: AIRPORTS[code].name }
    : { matched: false, code: null, name: supplied };
}

// ---- railway.js ----
// Nearest passenger railway stations, from OpenStreetMap via Overpass.
//
// Overpass is a shared community service: requests are queued one at a time,
// deduplicated per pin, cached in the plan for 30 days and never retried in a
// tight loop. Results are mapped stations, not a timetable — the train times on
// a leg are always entered by a person.

const STATION_SERVICE = 'https://overpass-api.de/api/interpreter';
// Overpass is community-run and sometimes at capacity; a mirror is tried next.
const STATION_MIRRORS = ['https://overpass.kumi.systems/api/interpreter'];
const STATION_RADIUS_KM = 50;

function stationDistance(a, b) {
  const r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r;
  const dLng = (b.lng - a.lng) * r;
  const q = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 6371 * 2 * Math.atan2(Math.sqrt(q), Math.sqrt(Math.max(0, 1 - q)));
}

// Keep mainline passenger stations only: metro, tram, monorail, freight-only,
// disused and preserved-railway stops are not somewhere a team can buy a ticket.
function stationCandidates(data, origin) {
  if (!Array.isArray(data.elements) || data.remark) throw new Error('Station search returned incomplete data. Please retry.');
  const rows = data.elements.flatMap((e) => {
    const t = e.tags || {};
    const p = { lat: e.lat ?? e.center?.lat, lng: e.lon ?? e.center?.lon };
    const name = t['name:en'] || t.name;
    const excluded =
      !name || !isCoordinate(p) ||
      !['station', 'halt'].includes(t.railway) ||
      ['subway', 'light_rail', 'monorail', 'tram'].includes(t.station) ||
      ['yes', 'only'].includes(t.subway) ||
      t.tram === 'yes' || t.train === 'no' || t.passenger === 'no' ||
      t.disused === 'yes' || t.abandoned === 'yes' || t['railway:preserved'] === 'yes';
    if (excluded) return [];
    const distance = stationDistance(origin, p);
    return distance <= STATION_RADIUS_KM
      ? [{ ...p, name, code: t['railway:ref'] || t.ref || '', id: e.type + '/' + e.id, distance, source: 'OpenStreetMap' }]
      : [];
  }).sort((a, b) => a.distance - b.distance || a.name.localeCompare(b.name));

  // Collapse the same station mapped twice (platform node plus area).
  return rows.filter((s, i) => !rows.slice(0, i).some((p) => p.name.toLowerCase() === s.name.toLowerCase() && stationDistance(p, s) < 0.5)).slice(0, 6);
}

function validStationLookup(value, p) {
  return (
    !!value && value.point === pointKey(p) && Number.isFinite(value.at) && Date.now() - value.at < 30 * 86400000 &&
    Array.isArray(value.stations) && value.stations.length > 0 && value.stations.length <= 6 &&
    value.stations.every((s) => isCoordinate(s) && typeof s.name === 'string' && Number.isFinite(s.distance))
  );
}

const pending = new Map();
let queue = Promise.resolve();

async function nearestStations(origin, { fetcher = fetch, endpoint = STATION_SERVICE, mirrors = STATION_MIRRORS } = {}) {
  if (!isCoordinate(origin)) throw new Error('Set the campus pin first.');
  const key = pointKey(origin);
  if (pending.has(key)) return pending.get(key);

  const task = queue.catch(() => {}).then(async () => {
    const query = `[out:json][timeout:20];nwr["railway"~"^(station|halt)$"](around:${STATION_RADIUS_KM * 1000},${origin.lat},${origin.lng});out center tags;`;
    let lastError = null;
    for (const service of [endpoint, ...mirrors]) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 25000);
      try {
        const response = await fetcher(service + '?data=' + encodeURIComponent(query), { signal: controller.signal, credentials: 'omit' });
        if (!response.ok) throw new Error('Railway station lookup is unavailable. Retry shortly.');
        const stations = stationCandidates(await response.json(), origin);
        if (!stations.length) throw new Error(`No mapped passenger railway station within ${STATION_RADIUS_KM} km. Enter a station manually.`);
        return { point: key, at: Date.now(), stations };
      } catch (error) {
        lastError = error;
        // "Nothing mapped nearby" is an answer, not an outage: don't retry it.
        if (/No mapped passenger/.test(error.message)) break;
      } finally {
        clearTimeout(timer);
      }
    }
    throw lastError || new Error('Railway station lookup is unavailable. Retry shortly.');
  });

  pending.set(key, task);
  queue = task;
  try {
    return await task;
  } finally {
    pending.delete(key);
  }
}

// Road time from a campus to its station and back again, so a rail itinerary
// prices its own first and last mile.
async function stationTransfers(origin, station, options = {}) {
  const matrix = await fetchRoadMatrix([origin, station], options);
  const state = { network: matrix };
  return { outbound: networkRoad(origin, station, state), inbound: networkRoad(station, origin, state) };
}

// ---- roster.js ----
// Exports and imports: per-person rosters out, JSON or CSV plans in.

const iso = (hours) => new Date(hours * 3600000).toISOString().slice(0, 10);

// One row per person per activity: the operational detail sheet.
function detailRosterRows(state, plan) {
  const header = [
    'Person', 'Team', 'Base', 'Date (IST)', 'Day', 'Route', 'Activity', 'From', 'To', 'College / campus',
    'Start time (IST)', 'End time (IST)', 'End date (IST)', 'Activity duration (hours)', 'Nights away', 'Status', 'Notes'
  ];
  const records = [];
  const used = new Set();

  for (const route of plan.routes) {
    const named = [...(route.memberNames || [])];
    const people = route.teamId
      ? [...named, ...Array.from({ length: Math.max(0, route.size - named.length) }, (_, i) => `Unnamed place ${i + 1} (${route.teamName})`)]
      : ['Unassigned traveller'];

    for (const person of people) {
      if (named.includes(person)) used.add(person);
      for (const e of [...route.events, ...route.overnights]) {
        const night = e.type === 'overnight';
        const travel = e.type === 'travel';
        const start = night ? e.day * 24 : e.start;
        const end = night ? (e.day + 1) * 24 : e.end;
        const activity = night
          ? 'Overnight stay'
          : travel
            ? { road: 'Road travel', air: 'Air travel', train: 'Train travel' }[e.leg.mode]
            : e.type === 'interview' ? 'Interview' : 'Assessment';
        const notes = travel
          ? `${formatHours(e.leg.hours)} total for this leg · ${e.leg.mode === 'road' ? Math.round(e.leg.distance || 0) + ' km' : e.leg.airports || 'itinerary entered manually'}`
          : night
            ? 'Assumed stay. Nothing is booked by this plan.'
            : `${e.college.name} · ${route.teamName}`;
        records.push({
          person,
          time: start,
          row: [
            person, route.teamName, route.base, iso(start), dateText(start, { weekday: 'long' }), route.number, activity,
            e.from || '', e.to || e.city || '', e.college?.name || '',
            night ? '' : timeText(e.start), night ? '' : timeText(e.end), night ? '' : iso(e.end),
            night ? '' : (e.end - e.start).toFixed(2), night ? 1 : 0,
            route.teamId ? 'Planned' : 'Needs a team', notes
          ]
        });
      }
    }
  }

  for (const team of state.teams) {
    for (const person of team.members || []) {
      if (used.has(person)) continue;
      records.push({
        person,
        time: Infinity,
        row: [person, team.name, teamBase(team, state), '', '', '', 'No assigned travel', '', '', '', '', '', '', '', 0,
          'No assigned travel', 'No feasible assigned journey in this plan']
      });
    }
  }

  for (const u of plan.unplaced) {
    const c = u.college;
    records.push({
      person: 'Unplaced visit',
      time: Infinity,
      row: ['Unplaced visit', '', '', c.date || '', '', '', c.visitType === 'interview' ? 'Interview' : 'Assessment',
        '', '', c.name, c.time || '', '', '', '', 0, 'Unplaced', u.reason]
    });
  }

  records.sort((a, b) => a.person.localeCompare(b.person) || a.time - b.time || String(a.row[5]).localeCompare(String(b.row[5])));
  return [header, ...records.map((r) => r.row)];
}

// One row per person, one column per calendar day: the sheet a team lead reads.
function calendarRosterRows(state, plan) {
  const detail = detailRosterRows(state, plan).slice(1);
  const people = new Map();
  const days = [];
  const dayNumber = (isoDate) => Math.floor(Date.parse(isoDate + 'T00:00:00Z') / 86400000);

  const add = (name, location, team) => {
    const key = JSON.stringify([name, location, team]);
    if (!people.has(key)) people.set(key, { name, location, team, cells: new Map() });
    return people.get(key);
  };
  for (const team of state.teams) for (const name of team.members || []) add(name, teamBase(team, state), team.name);

  for (const row of detail) {
    const [name, team, location, date, , , activity, , , college, , endTime, endDate] = row;
    if (name === 'Unplaced visit') {
      if (date) days.push(dayNumber(date));
      continue;
    }
    const person = add(name, location, team);
    if (!date) continue;
    const start = dayNumber(date);
    let end = dayNumber(endDate || date);
    // Midnight is the exclusive end of the preceding day's activity.
    if (end > start && (endTime === '00:00' || activity === 'Overnight stay')) end--;
    const label =
      activity === 'Assessment' ? college
      : activity === 'Interview' ? `Interview: ${college}`
      : activity.includes('travel') ? 'Travel'
      : activity === 'Overnight stay' ? 'Overnight'
      : activity;
    for (let d = start; d <= end; d++) {
      days.push(d);
      if (!person.cells.has(d)) person.cells.set(d, new Set());
      person.cells.get(d).add(label);
    }
  }

  if (!days.length) {
    return [['Full name', 'Base', 'Team'], ...[...people.values()].map((p) => [p.name, p.location, p.team])];
  }
  const first = Math.min(...days);
  const last = Math.max(...days);
  const dates = Array.from({ length: last - first + 1 }, (_, i) => first + i);
  const header = ['Full name', 'Base', 'Team', ...dates.map((d) => new Date(d * 86400000).toISOString().slice(0, 10))];
  return [
    header,
    ...[...people.values()].map((p) => [p.name, p.location, p.team, ...dates.map((d) => [...(p.cells.get(d) || [])].join(' / ') || '-')])
  ];
}

// Quote every cell, and defuse anything a spreadsheet would treat as a formula.
function csvCell(value) {
  let s = String(value ?? '');
  if (s !== '-' && /^[=+@\-\t\r]/.test(s)) s = "'" + s;
  return '"' + s.replaceAll('"', '""') + '"';
}

const toCSV = (rows) => '﻿' + rows.map((r) => r.map(csvCell).join(',')).join('\r\n');

const CSV_TEMPLATE =
  'college,city,date,start,duration,team,latitude,longitude,address,airport,interview_date,interview_start,interview_duration\r\n' +
  'Your college,Pune,2026-09-24,09:00,6,auto,,,,auto,,09:00,6\r\n';

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = '';
  let quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') {
      if (quoted && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else quoted = !quoted;
    } else if (c === ',' && !quoted) {
      row.push(cell);
      cell = '';
    } else if ((c === '\n' || c === '\r') && !quoted) {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell);
      if (row.some((x) => x.trim())) rows.push(row);
      row = [];
      cell = '';
    } else cell += c;
  }
  if (quoted) throw new Error('CSV has an unclosed quote.');
  row.push(cell);
  if (row.some((x) => x.trim())) rows.push(row);
  return rows;
}

// Turn a CSV of colleges into a new plan, keeping the current teams, settings
// and custom cities. Coordinates in the file count as confirmed campus pins.
function csvPlan(text, state) {
  const rows = parseCSV(text.replace(/^﻿/, ''));
  if (rows.length < 2) throw new Error('CSV needs a header row and at least one college.');
  const headers = rows.shift().map((x) => x.trim().toLowerCase());
  if (!['college', 'city', 'date'].every((h) => headers.includes(h))) {
    throw new Error('Required CSV headers: college, city, date. Use the downloadable template.');
  }
  const next = structuredClone(state);
  const cities = locationsOf(next);
  const aliases = { bengaluru: 'Bangalore', calicut: 'Kozhikode', trivandrum: 'Thiruvananthapuram', madras: 'Chennai', trichy: 'Tiruchirappalli' };

  next.colleges = rows.map((row, i) => {
    const data = Object.fromEntries(headers.map((h, j) => [h, (row[j] || '').trim()]));
    if (!data.college) throw new Error(`Row ${i + 2}: the college name is required.`);

    let city = aliases[data.city.toLowerCase()] || data.city;
    const matched = Object.keys(cities).find((c) => c.toLowerCase() === city.toLowerCase());
    if (city && !matched) throw new Error(`Row ${i + 2}: "${data.city}" is not a known city. Add coordinates, or use one of the reference cities.`);
    city = matched || '';

    const team = data.team && data.team.toLowerCase() !== 'auto'
      ? next.teams.find((t) => t.id === data.team || t.name.toLowerCase() === data.team.toLowerCase())
      : null;
    if (data.team && data.team.toLowerCase() !== 'auto' && !team) throw new Error(`Row ${i + 2}: no team called "${data.team}".`);

    const lat = Number(data.latitude);
    const lng = Number(data.longitude);
    const pinned = data.latitude !== '' && data.longitude !== '';
    if (pinned && !(Number.isFinite(lat) && Number.isFinite(lng))) throw new Error(`Row ${i + 2}: latitude and longitude must both be numbers.`);
    if (!pinned && !city) throw new Error(`Row ${i + 2}: give a known city or a latitude/longitude pin.`);

    const duration = data.duration ? Number(data.duration) : 6;
    if (!Number.isFinite(duration)) throw new Error(`Row ${i + 2}: duration must be a number of hours.`);

    return {
      id: 'csv-' + (i + 1),
      name: data.college,
      city,
      date: data.date || '',
      time: data.start || '09:00',
      duration,
      team: team?.id || 'auto',
      demo: false,
      airport: data.airport || 'auto',
      ...(pinned
        ? { location: { lat, lng, confirmed: true, address: data.address || '', source: 'Imported CSV pin' } }
        : {}),
      ...(data.interview_date
        ? {
            interviewDate: data.interview_date,
            interviewTime: data.interview_start || '09:00',
            interviewDuration: data.interview_duration ? Number(data.interview_duration) : duration
          }
        : {})
    };
  });
  next.demo = false;
  next.network = undefined;
  next.overrides = {};
  return next;
}

// A compact plain-text brief for pasting into a message or ticket.
function planSummaryText(state, plan) {
  const lines = [`CampusRoute plan · base ${state.base} · all times IST`, ''];
  for (const route of plan.routes) {
    lines.push(`Route ${route.number} · ${route.teamName} (${route.size} people) · from ${route.base}`);
    lines.push(`  ${dateText(route.start)} ${timeText(route.start)} → ${dateText(route.end)} ${timeText(route.end)} · ${formatHours(route.hours)} travel · ${route.nights} nights away`);
    for (const e of [...route.events, ...route.overnights].sort((a, b) => a.start - b.start)) {
      const when = `${dateText(e.start)} ${e.type === 'overnight' ? '' : timeText(e.start) + '–' + timeText(e.end)}`.trim();
      const what =
        e.type === 'overnight' ? `Overnight in ${e.city}`
        : e.type === 'travel' ? `${e.from} → ${e.to} (${e.leg.mode})`
        : `${e.type === 'interview' ? 'Interview' : 'Assessment'}: ${e.college.name}`;
      lines.push(`    ${when} · ${what}`);
    }
    lines.push('');
  }
  for (const u of plan.unplaced) lines.push(`Unplaced: ${u.college.name} — ${u.reason}`);
  return lines.join('\n');
}

function toast(message) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = message;
  el.classList.add('visible');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove('visible'), 3700);
}

function download(name, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    return false;
  }
}

// A deliberately schematic map: it shows the shape of a route, and says so.
function mapView(ctx, route) {
  const { state } = ctx;
  const points = [endpointSafe(route?.base || state.base, state), ...(route?.stops || []).map((c) => endpointSafe(c, state))].filter(Boolean);
  if (!points.length) return '<div class="map-container empty">No mapped points yet.</div>';

  let minLat = Math.min(...points.map((p) => p.lat)) - 1.5;
  let maxLat = Math.max(...points.map((p) => p.lat)) + 1.5;
  let minLng = Math.min(...points.map((p) => p.lng)) - 2;
  let maxLng = Math.max(...points.map((p) => p.lng)) + 2;
  if (maxLat - minLat < 5) {
    const mid = (maxLat + minLat) / 2;
    minLat = mid - 2.5;
    maxLat = mid + 2.5;
  }
  if (maxLng - minLng < 6) {
    const mid = (maxLng + minLng) / 2;
    minLng = mid - 3;
    maxLng = mid + 3;
  }
  const W = 560;
  const H = 350;
  const scale = Math.min((W - 90) / (maxLng - minLng), (H - 55) / (maxLat - minLat));
  const cx = (minLng + maxLng) / 2;
  const cy = (minLat + maxLat) / 2;
  const xy = (lng, lat) => [W / 2 + (lng - cx) * scale, H / 2 - (lat - cy) * scale];
  const path = (coords) => coords.map(([lng, lat], i) => (i ? 'L' : 'M') + xy(lng, lat).map((v) => v.toFixed(1)).join(',')).join(' ');
  // Illustrative coastline only — a context cue, not a boundary.
  const land = [[67, 25], [69, 23], [68.5, 22.4], [70, 20.8], [72.5, 21.5], [72.8, 19.1], [73.1, 17], [74.4, 14.5], [75.5, 12], [76.7, 9.4],
    [77.6, 8.1], [78.2, 9.2], [79.3, 10.3], [79.9, 12], [80.3, 13.3], [80.2, 15], [82.3, 17], [85.6, 19.6], [88, 21.5], [89.5, 24], [88, 29], [80, 34], [72, 34]];

  const links = (route?.legs || [])
    .filter((l) => pointKey(l.fromPoint) !== pointKey(l.toPoint))
    .map((l) => {
      const a = xy(l.fromPoint.lng, l.fromPoint.lat);
      const b = xy(l.toPoint.lng, l.toPoint.lat);
      const mx = (a[0] + b[0]) / 2;
      const my = (a[1] + b[1]) / 2;
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const curve = l.mode === 'air' ? 0.13 : 0.03;
      const stroke = l.mode === 'train' ? '#bf8131' : l.mode === 'air' ? '#9583b8' : routeColor(route);
      const dash = l.mode === 'train' ? 'stroke-dasharray="9 3 2 3"' : l.mode === 'air' ? 'stroke-dasharray="5 5"' : '';
      return `<path d="M${a} Q${mx - dy * curve},${my + dx * curve} ${b}" fill="none" stroke="${stroke}" stroke-width="2" ${dash} opacity=".83">
        <title>${esc(l.from)} → ${esc(l.to)} · ${l.mode} · ${formatHours(l.hours)}</title></path>`;
    })
    .join('');

  const labels = points
    .map((p, i) => {
      const full = p.kind === 'campus' ? p.city || p.label : p.label;
      const name = full.length > 26 ? full.slice(0, 23) + '…' : full;
      const [x, y] = xy(p.lng, p.lat);
      const isBase = i === 0;
      const labelX = x > W - 150 ? -14 : 14;
      const anchor = x > W - 150 ? 'end' : 'start';
      return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><title>${esc(p.label)} · ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}${isBase ? ' · base' : ''}</title>
        ${isBase ? '<circle r="14" fill="#fff" opacity=".85"/><circle r="10" fill="#215c4b"/>' : `<circle r="12" fill="#fff" opacity=".92"/><circle r="8.5" fill="${route ? routeColor(route) : '#628764'}"/>`}
        <text y="3" text-anchor="middle" font-size="8" font-weight="700" fill="white" style="stroke:none">${isBase ? 'B' : i}</text>
        <text x="${labelX}" y="4" text-anchor="${anchor}" font-size="10" font-weight="${isBase ? '700' : '550'}" fill="#526f62">${esc(name)}</text></g>`;
    })
    .join('');

  return `<div class="map-container"><svg class="map-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Schematic map of the selected route">
    <defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#cbdbd9" opacity=".45"/></pattern>
    <clipPath id="mapclip"><rect width="${W}" height="${H}"/></clipPath></defs>
    <rect width="${W}" height="${H}" fill="#edf3f4"/><g clip-path="url(#mapclip)">
    <path d="${path(land)}Z" fill="#f2f4ed" stroke="#d4ded4" stroke-width="1.2"/>
    <rect width="${W}" height="${H}" fill="url(#dots)"/>${links}${labels}</g></svg>
    <div class="map-north">N${icon('north')}</div>
    <div class="map-label">${route ? `ROUTE ${String(route.number).padStart(2, '0')} · ${route.stops.length} STOPS` : 'BASE LOCATION'}</div></div>`;
}

function endpointSafe(value, state) {
  try {
    return endpoint(value, state);
  } catch {
    return null;
  }
}

function ganttView(ctx, route) {
  const first = dayOf(route.start);
  const last = dayOf(route.end);
  const days = last - first + 1;
  const span = days * 24;
  const origin = first * 24;

  const row = (name, events, index) => `<div class="gantt-row"><div class="gantt-label" style="--route:${routeColor(route)}"><i class="dot"></i>${name}</div>
    <div class="gantt-track">${events
      .map((e) => {
        const left = ((e.start - origin) / span) * 100;
        const width = Math.max(((e.end - e.start) / span) * 100, e.type === 'overnight' ? 0.8 : 0);
        const title = e.college
          ? (e.college.visitType === 'interview' ? 'Interview: ' : 'Assessment: ') + e.college.name
          : e.type === 'overnight' ? `Overnight: ${e.city}` : `${e.leg.from} → ${e.leg.to} · ${e.leg.mode}`;
        const when = `${dateText(e.start)} ${timeText(e.start)}${e.type !== 'overnight' ? '–' + timeText(e.end) + ' · ' + formatHours(e.end - e.start) : ''}`;
        return `<div class="gantt-bar ${e.type} ${e.leg?.mode || ''}" style="left:${left}%;width:${width}%" title="${esc(title)} · ${esc(when)}">${e.college ? index : ''}</div>`;
      })
      .join('')}</div></div>`;

  return `<div class="timeline-wrap"><div class="gantt" style="--days:${days}"><div class="gantt-header"><span>ACTIVITY / CAMPUS</span>
    <div class="gantt-days">${Array.from({ length: days }, (_, i) => {
      const h = (first + i) * 24;
      const weekday = new Date(h * 3600000).getUTCDay();
      return `<span class="${weekday === 0 || weekday === 6 ? 'weekend' : ''}">${dateText(h)}</span>`;
    }).join('')}</div></div>
    ${row('Travel &amp; transfers', route.events.filter((e) => e.type === 'travel'))}
    ${route.stops
      .map((c, i) => row(esc((c.visitType === 'interview' ? 'Interview · ' : 'Assessment · ') + (hasCampusPin(c) ? c.name : locationName(c))),
        route.events.filter((e) => e.college?.id === c.id), i + 1))
      .join('')}
    ${row('Overnight stays', route.overnights)}</div></div>
    <div class="timeline-legend"><span><i class="square"></i>Assessment</span><span><i class="square interview"></i>Interview</span>
    <span><i class="square road"></i>Road</span><span><i class="square air"></i>Air</span><span><i class="square train"></i>Train</span>
    <span><i class="square night"></i>Overnight</span>
    <button class="text-button" data-detail="schedule">Full itinerary ${icon('arrow')}</button></div>`;
}

function itineraryView(ctx, route) {
  const { state } = ctx;
  const events = [
    ...route.events,
    ...route.overnights.map((n) => ({ ...n, start: n.day * 24 + 23.99, end: (n.day + 1) * 24 + state.settings.dayStart }))
  ].sort((a, b) => a.start - b.start);

  const groups = new Map();
  for (const e of events) {
    const d = dayOf(e.start);
    if (!groups.has(d)) groups.set(d, []);
    groups.get(d).push(e);
  }

  const rows = [...groups]
    .map(([day, items], dayIndex) => `<section class="itinerary-day"><h3>Day ${dayIndex + 1} <span>${dateText(day * 24, {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    })}</span></h3><ol class="journey-steps">${items
      .map((e) => {
        const travel = e.type === 'travel';
        const night = e.type === 'overnight';
        const leg = e.leg;
        const title = travel
          ? `${esc(e.from)} → ${esc(e.to)}`
          : night
            ? e.city === 'En route' ? 'Overnight en route · location to confirm' : 'Stay overnight in ' + esc(e.city)
            : esc(e.college.name);
        const label = travel
          ? (e === route.events.at(-1) ? 'Return to base · ' : 'Travel · ') + modeLabel(leg.mode)
          : night ? 'Overnight stay' : e.college.visitType === 'interview' ? 'Interview' : 'Assessment';
        const info = travel
          ? leg.mode === 'train'
            ? `${esc(leg.rail.fromStation)} → ${esc(leg.rail.toStation)} · ${formatHours(leg.rail.departureHours)} to the station + ${formatHours(leg.rail.hours)} by train + ${formatHours(leg.rail.arrivalHours)} onward + ${formatHours(leg.rail.buffer)} boarding buffer. Confirm the timetable.`
            : leg.mode === 'air'
              ? airBreakdown(leg) + '. Flight schedule still to confirm.'
              : `${sourceLabel(leg.roadSource)} · ${e.from === 'En route' || e.to === 'En route' ? 'part of a multi-day road journey' : num(leg.distance) + ' km'}`
          : night
            ? `Assumed stay for ${route.size} people. Nothing is booked by this plan.`
            : `${esc(locationName(e.college))} · ${esc(route.teamName)}`;
        return `<li class="journey-step ${e.type}"><div class="step-time">${night ? 'Overnight' : timeText(e.start) + '–' + timeText(e.end)}</div>
          <div class="step-body"><span class="step-label">${label}</span><strong>${title}</strong><small>${info}</small></div>
          <div class="step-side">${night ? icon('moon') : travel ? icon(leg.mode === 'air' ? 'plane' : leg.mode === 'train' ? 'train' : 'car') : icon('college')}
          <span>${night ? '' : formatHours(e.end - e.start)}</span></div></li>`;
      })
      .join('')}</ol></section>`)
    .join('');

  const dutyByDay = [...groups].map(([day, items]) => {
    const travel = items.filter((e) => e.type === 'travel').reduce((n, e) => n + (e.end - e.start), 0);
    const duty = items.filter((e) => e.type !== 'overnight').reduce((n, e) => n + (e.end - e.start), 0);
    return { day, travel, duty };
  });

  return `<div class="itinerary">${rows}</div>
    <div class="duty-table"><h4>Daily load against your limits</h4><table><thead><tr><th>Day</th><th>Travelling</th><th>On duty</th></tr></thead><tbody>
    ${dutyByDay.map((d) => `<tr><td>${dateText(d.day * 24, { weekday: 'short', day: 'numeric', month: 'short' })}</td>
      <td class="${d.travel > state.settings.maxTravel + 1e-6 ? 'over' : ''}">${formatHours(d.travel)} / ${state.settings.maxTravel}h</td>
      <td class="${d.duty > state.settings.maxDuty + 1e-6 ? 'over' : ''}">${formatHours(d.duty)} / ${state.settings.maxDuty}h</td></tr>`).join('')}
    </tbody></table></div>`;
}

function legsView(ctx, route) {
  return `<div class="legs"><table class="leg-table"><thead><tr><th>Leg</th><th>Road</th><th>Air</th><th>Train</th><th>Chosen</th><th></th></tr></thead><tbody>
    ${route.legs
      .map((l, i) => {
        const cell = (value, source, extra = '') =>
          value === null || value === undefined
            ? '<td class="unavailable">—</td>'
            : `<td><strong>${formatHours(value)}</strong><small>${esc(source)}${extra}</small></td>`;
        return `<tr class="${l.custom ? 'custom' : ''}">
          <td><strong>${esc(l.from)} → ${esc(l.to)}</strong><small>${l.airports ? esc(l.airports) + ' · ' : ''}${num(l.distance)} km by road${
            l.precise ? '' : ' · city-level estimate'}</small></td>
          ${cell(l.road, sourceLabel(l.roadSource))}
          ${cell(l.air, sourceLabel(l.airSource), l.air !== null && l.flightHours ? ` · ${formatHours(l.flightHours)} airborne` : '')}
          ${l.train === null ? '<td class="unavailable">—</td>' : cell(l.train, 'Your train itinerary')}
          <td><span class="mode-pill ${l.mode}">${icon(l.mode === 'air' ? 'plane' : l.mode === 'train' ? 'train' : 'car')}${modeLabel(l.mode)}</span>
            ${l.custom ? '<small>manual preference</small>' : '<small>model choice</small>'}</td>
          <td class="row-actions">${actButton('edit-leg', 'Adjust', 'secondary small', 'edit', `data-index="${i}"`)}
            <a class="text-button" href="${directionsLink(l.fromPoint, l.toPoint)}" target="_blank" rel="noopener noreferrer">Directions</a></td></tr>`;
      })
      .join('')}</tbody></table>
    <p class="form-note">Air times combine measured or estimated airport transfers, ${formatHours(ctx.state.settings.airportBuffer)} of airport time and
      a great-circle flight at 650 km/h. They are planning figures, never a bookable schedule. Enter a verified duration on any leg to override the model.</p></div>`;
}

function collegeRow(ctx, c) {

  const routes = plan.routes.filter((r) => r.stops.some((s) => s.sourceCollegeId === c.id));
  const unplaced = plan.unplaced.filter((u) => u.college.sourceCollegeId === c.id);
  const stations = state.stationLookups?.[c.location ? pointKey(c.location) : ''];

  return `<article class="campus-card" data-college-name="${esc([c.name, c.city, c.location?.address].filter(Boolean).join(' ').toLowerCase())}">

      <p>${esc(locationName(c))}${c.location?.address ? ' · ' + esc(c.location.address) : ''}</p></div>
      <div class="row-actions">${actButton('college-staffing', 'Staffing', 'secondary small', 'users', `data-id="${esc(c.id)}"`)}
        ${actButton('edit-college', 'Edit', 'secondary small', 'edit', `data-id="${esc(c.id)}"`)}
        ${actButton('delete-college', 'Remove', 'danger small', 'trash', `data-id="${esc(c.id)}"`)}</div></div>
    <div class="campus-tags">
      <span class="tag ${pinned ? 'good' : 'warn'}">${pinned ? 'Campus pin confirmed' : 'City-level location'}</span>
      ${c.requiredPeople ? `<span class="tag muted">${c.requiredPeople} people needed</span>` : ''}
      ${(c.assignedMembers || []).length ? `<span class="tag muted">${esc(c.assignedMembers.join(', '))}</span>` : ''}
      ${c.team !== 'auto' ? `<span class="tag muted">Fixed: ${esc(state.teams.find((t) => t.id === c.team)?.name || c.team)}</span>` : ''}
      ${routes.map((r) => `<button class="tag route-tag" data-route="${r.id}">Route ${r.number}</button>`).join('')}
      ${unplaced.map((u) => `<span class="tag bad" title="${esc(u.reason)}">Unplaced</span>`).join('')}</div>
    <div class="campus-dates">
      <label>Assessment date<input type="date" data-college-date="${esc(c.id)}" value="${esc(c.date || '')}" min="2020-01-01" max="2040-12-31">
        <small>${c.date ? esc(c.time) + ' · ' + formatHours(c.duration) : 'Not scheduled'}</small></label>
      <label>Interview date<input type="date" data-college-interview="${esc(c.id)}" value="${esc(c.interviewDate || '')}" min="2020-01-01" max="2040-12-31">
        <small>${c.interviewDate ? esc(c.interviewTime || '09:00') + ' · ' + formatHours(c.interviewDuration ?? c.duration) : 'Not scheduled'}</small></label></div>
    <div class="campus-transport">
      <small class="transport-line"><strong>Location:</strong> ${pinned
        ? `<a href="${mapLink(c.location)}" target="_blank" rel="noopener noreferrer">${c.location.lat.toFixed(5)}, ${c.location.lng.toFixed(5)}</a> · ${esc(c.location.source || 'confirmed pin')}`
        : 'No confirmed pin · travel is priced from the city reference point'}</small>
      <small class="transport-line"><strong>Airport:</strong> ${airport
        ? airport.matched ? `${esc(airport.code)} · ${esc(airport.name)}` : `${esc(airport.name)} · not in the reference list`
        : c.airport && c.airport !== 'auto' ? esc(c.airport) + (AIRPORTS[c.airport] ? ' · ' + esc(AIRPORTS[c.airport].name) : '') : 'Nearest airport, chosen automatically'}</small>
      <small class="transport-line" data-station-summary="${c.location ? esc(pointKey(c.location)) : ''}">${
        pinned
          ? validStationLookup(stations, c.location)
            ? `<strong>Railway:</strong> <a href="${mapLink(stations.stations[0])}" target="_blank" rel="noopener noreferrer">${esc(stations.stations[0].name)}</a> · ${num(stations.stations[0].distance)} km`
            : `<strong>Railway:</strong> not looked up yet ${actButton('college-station', 'Find nearest station', 'secondary small', 'train', `data-id="${esc(c.id)}"`)}`
          : '<strong>Railway:</strong> confirm a campus pin to look up stations'}</small>
      ${visits.length ? `<small class="transport-line"><strong>Visits:</strong> ${visits.map((v) => esc((v.visitType === 'interview' ? 'Interview ' : 'Assessment ') + v.date)).join(' · ')}</small>` : ''}</div></article>`;
}

function peopleView(ctx) {
  const { state, plan } = ctx;
  const people = state.teams.flatMap((t) =>
    (t.members || []).map((name) => ({
      name,
      team: t,

    }))

  return `<section class="panel individual-travel"><div class="panel-head"><div><h2>Individual planned travel</h2>

    ${people.length
      ? `<div class="person-list">${people
          .map((p) => `<article class="person-row"><div><h3>${esc(p.name)}</h3><p>${esc(p.team.name)} · ${esc(teamBase(p.team, state))} base</p>
            <div class="person-totals"><strong>${p.routes.length} route${p.routes.length === 1 ? '' : 's'}</strong>
              <span>${formatHours(p.routes.reduce((n, r) => n + r.hours, 0))} travel</span>
              <span>${p.routes.reduce((n, r) => n + r.nights, 0)} nights away</span></div></div>
            <div class="person-routes">${p.routes.length

      : '<div class="empty">Add member names to a team to see individual travel.</div>'}

const SETTING_FIELDS = [
  ['roadSpeed', 'Average road speed', 'km/h, used when no measured route exists', 20, 100, 5],
  ['roadFactor', 'Road distance multiplier', '× straight-line distance', 1, 2, 0.05],
  ['airportBuffer', 'Airport time', 'hours across both airports', 0, 6, 0.25],
  ['buffer', 'Transfer buffer', 'hours before and after each visit', 0, 3, 0.25],
  ['dayStart', 'Earliest daily start', 'hour, IST', 0, 12, 1],
  ['dayEnd', 'Latest daily finish', 'hour, IST', 12, 24, 1],
  ['maxTravel', 'Most travel in one day', 'hours', 1, 24, 0.5],
  ['maxDuty', 'Most duty in one day', 'hours of travel plus visits', 1, 24, 0.5],
  ['rest', 'Overnight rest', 'hours between days', 0, 14, 0.5],
  ['maxNights', 'Most nights away per route', 'nights', 0, 30, 1]
];

function settingsView(ctx) {
  const { state } = ctx;
  return `<div class="panel"><div class="panel-head"><div><h2>Practical boundaries, better plans</h2>
      <p>These assumptions decide what counts as feasible and drive every travel estimate.</p></div>
      ${actButton('airport-pins', 'Airport access pins', 'secondary small', 'pin')}</div>
    <form id="settings-form"><div class="settings-grid">${SETTING_FIELDS.map(([key, label, unit, min, max, step]) =>
      `<label class="field">${label}<input name="${key}" type="number" value="${state.settings[key]}" min="${min}" max="${max}" step="${step}" required><small>${unit}</small></label>`
    ).join('')}
      <label class="field">Routing priority<select name="priority">
        ${[['balanced', 'Balanced'], ['teams', 'Fewer teams and tours'], ['time', 'Least travel time']]
          .map(([v, l]) => `<option value="${v}" ${state.settings.priority === v ? 'selected' : ''}>${l}</option>`)
          .join('')}</select><small>how merging trades travel against tours</small></label></div>
      <div class="panel-footer"><span>Road matrix: ${state.network
        ? `${state.network.pointKeys.length} points measured ${new Date(state.network.updatedAt).toISOString().slice(0, 10)} · ${esc(state.network.source)}`
        : 'not measured yet — estimates come from coordinates'}</span>
        <span class="row-actions">${actButton('refresh-roads', 'Refresh road matrix', 'secondary small', 'refresh')}
        <button class="btn primary small" type="submit">${icon('check')} Apply assumptions</button></span></div></form>
    <div class="assumptions-copy">
      <div><h3>How an estimate is built</h3><p>With a confirmed campus pin, road legs use a measured OSRM driving time and distance, plus a
        15-minute break every 200&nbsp;km. Without a pin, they use straight-line distance × the multiplier ÷ your average speed. Air legs add
        transfers at both ends, your airport time and a great-circle flight at 650&nbsp;km/h. Train legs are always figures you enter.</p></div>
      <div><h3>What is never claimed</h3><p>No fares, no live traffic, no flight or train availability, and no booking. Overnight stays are
        assumed where a route cannot get home, not reserved. Treat every number as a planning estimate to confirm before anyone travels.</p></div>
      <div><h3>Where the data comes from</h3><p>Place search and campus pins come from Photon and OpenStreetMap; road times from OSRM; railway
        stations from Overpass. Airport coordinates are reference points, not terminal entrances.</p></div></div></div>`;
}

// ---- share.js ----
// Persistence and public sharing.
//
// There are no accounts. A plan lives in one of three modes:
//
//   local        the plan exists only in this browser (localStorage)
//   shared-edit  the plan is on the server and this browser holds its edit key
//   shared-view  the plan is on the server and this browser can only read it
//
// The plan id and the edit key both live in the URL *fragment*, so the key is
// never sent to the server in a request line, a log or a Referer header. It is
// sent explicitly, as a header, only on the requests that need it.

const DRAFT_KEY = 'campusroute.draft.v1';
const LAST_PLAN_KEY = 'campusroute.last-plan.v1';
const KEYS_KEY = 'campusroute.edit-keys.v1';

const storage = safeStorage();

// --- URL fragment ----------------------------------------------------------

function readLocation(hash = globalThis.location?.hash || '') {
  const params = new URLSearchParams(hash.replace(/^#/, ''));
  const id = params.get('p') || '';
  return { id: /^[A-Za-z0-9_-]{6,64}$/.test(id) ? id : '', token: params.get('k') || '' };
}

function planUrl(id, token) {
  const base = globalThis.location ? globalThis.location.origin + globalThis.location.pathname : '';
  return base + '#p=' + encodeURIComponent(id) + (token ? '&k=' + encodeURIComponent(token) : '');
}

function setFragment(id, token) {
  if (!globalThis.history || !globalThis.location) return;
  const next = id ? '#p=' + encodeURIComponent(id) + (token ? '&k=' + encodeURIComponent(token) : '') : '#';
  if (globalThis.location.hash !== next) globalThis.history.replaceState(null, '', next);
}

// Edit keys are also remembered per plan, so returning with a plain view link
// from the same browser still opens the plan for editing.
function rememberKey(id, token) {
  if (!storage || !id || !token) return;
  try {
    const keys = JSON.parse(storage.getItem(KEYS_KEY) || '{}');
    keys[id] = token;
    storage.setItem(KEYS_KEY, JSON.stringify(keys));
  } catch {
    /* ignore */
  }
}

function recallKey(id) {
  if (!storage || !id) return '';
  try {
    return JSON.parse(storage.getItem(KEYS_KEY) || '{}')[id] || '';
  } catch {
    return '';
  }
}

// --- local draft -----------------------------------------------------------

function readDraft() {
  if (!storage) return null;
  try {
    const raw = storage.getItem(DRAFT_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return validateState(parsed).length ? null : parsed;
  } catch {
    return null;
  }
}

function writeDraft(state) {
  try {
    storage?.setItem(DRAFT_KEY, JSON.stringify(state));
    return true;
  } catch {
    return false;
  }
}

// --- server --------------------------------------------------------------

// Where the plan API lives. Defaults to /api; a host that serves the planner
// under a path prefix (the Vercel deployment mounts it at /campusroute) sets
// `window.CAMPUSROUTE_API_BASE` in the page before this module loads.
const apiBase = () => String(globalThis.CAMPUSROUTE_API_BASE || '/api').replace(/\/$/, '');

async function api(path, { method = 'GET', body, token } = {}) {
  const response = await fetch(apiBase() + path, {
    method,
    cache: 'no-store',
    headers: {
      ...(body ? { 'Content-Type': 'application/json' } : {}),
      ...(token ? { 'X-Edit-Key': token } : {})
    },
    body: body ? JSON.stringify(body) : undefined
  });
  let payload = {};
  try {
    payload = await response.json();
  } catch {
    /* non-JSON error page */
  }
  if (!response.ok) {
    const error = new Error(payload.error || `The server replied ${response.status}.`);
    error.status = response.status;
    error.payload = payload;
    throw error;
  }
  return payload;
}

class Sharing {
  constructor({ onStatus } = {}) {
    this.onStatus = onStatus || (() => {});
    this.id = '';
    this.token = '';
    this.revision = 0;
    this.mode = 'local';
    this.serverAvailable = null; // null = not probed yet
    this.dirty = false;
    this.busy = false;
    this.conflict = false;
    this.status = 'Local draft in this browser';
    this.updatedAt = null;
    this.saveTimer = null;
  }

  get canEdit() {
    return this.mode !== 'shared-view';
  }

  setStatus(status) {
    this.status = status;
    this.onStatus(status);
  }

  async probeServer() {
    if (this.serverAvailable !== null) return this.serverAvailable;
    // Opened straight from disk (the single-file build): there is no API to ask.
    if (globalThis.location?.protocol === 'file:') {
      this.serverAvailable = false;
      return false;
    }
    try {
      const health = await api('/health');
      // A host that answers but has no plan store (`db: false`) cannot share a
      // plan, so treat it as no server rather than offering a Publish button
      // that would fail.
      this.serverAvailable = health.ok === true && health.db !== false;
    } catch {
      this.serverAvailable = false;
    }
    return this.serverAvailable;
  }

  // Called once at startup. Returns the state to show, or null to keep the
  // caller's own starting plan.
  async open() {
    const { id, token } = readLocation();
    await this.probeServer();
    if (!id) {
      this.mode = 'local';
      this.setStatus(this.serverAvailable ? 'Local draft · publish to share a link' : 'Local draft in this browser');
      return null;
    }
    if (!this.serverAvailable) {
      this.mode = 'local';
      this.setStatus('This build has no plan server, so shared links cannot be opened here.');
      return null;
    }
    this.id = id;
    this.token = token || recallKey(id);
    return this.load();
  }

  async load() {
    try {
      const result = await api('/plans/' + encodeURIComponent(this.id), { token: this.token });
      const errors = validateState(result.state);
      if (errors.length) throw new Error('The shared plan needs review: ' + errors[0]);
      this.revision = result.revision;
      this.updatedAt = result.updatedAt;
      this.mode = result.canEdit ? 'shared-edit' : 'shared-view';
      this.conflict = false;
      this.dirty = false;
      if (result.canEdit) rememberKey(this.id, this.token);
      setFragment(this.id, result.canEdit ? this.token : '');
      this.setStatus(this.describe());
      return result.state;
    } catch (error) {
      if (error.status === 404) {
        this.id = '';
        this.token = '';
        this.mode = 'local';
        setFragment('', '');
        this.setStatus('That shared plan no longer exists. Showing a local draft instead.');
        return null;
      }
      this.mode = 'local';
      this.setStatus(error.message + ' Working from the local draft.');
      return null;
    }
  }

  describe() {
    const when = this.updatedAt ? ' · updated ' + new Date(this.updatedAt).toISOString().replace('T', ' ').slice(0, 16) + ' UTC' : '';
    if (this.mode === 'shared-edit') return 'Shared plan · anyone with the link can view' + when;
    if (this.mode === 'shared-view') return 'Read-only shared plan' + when;
    return 'Local draft in this browser';
  }

  // Publish the current local plan and become its editor.
  async publish(state) {
    if (!(await this.probeServer())) throw new Error('This build has no plan server, so it cannot publish a shared link.');
    const result = await api('/plans', { method: 'POST', body: { state } });
    this.id = result.id;
    this.token = result.editKey;
    this.revision = result.revision;
    this.updatedAt = result.updatedAt;
    this.mode = 'shared-edit';
    this.conflict = false;
    this.dirty = false;
    rememberKey(this.id, this.token);
    setFragment(this.id, this.token);
    this.setStatus(this.describe());
    return { viewUrl: planUrl(this.id, ''), editUrl: planUrl(this.id, this.token) };
  }

  // Copy a plan (usually one you can only view) into a new shared plan you own.
  async fork(state) {
    return this.publish(state);
  }

  // Queue a save. Local drafts are written immediately; shared plans are
  // debounced so typing does not become one request per keystroke.
  save(state, { immediate = false } = {}) {
    const wrote = writeDraft(state);
    if (this.mode !== 'shared-edit') {
      this.setStatus(wrote ? 'Local draft saved in this browser' : 'Browser storage is unavailable — export a backup');
      return;
    }
    this.dirty = true;
    if (this.conflict) {
      this.setStatus('Someone else changed the shared plan. Reload before saving; your draft is kept.');
      return;
    }
    this.setStatus('Saving shared plan…');
    clearTimeout(this.saveTimer);
    if (immediate) return this.flush(state);
    this.saveTimer = setTimeout(() => this.flush(state), 700);
  }

  async flush(state) {
    if (this.mode !== 'shared-edit' || this.busy || this.conflict || !this.dirty) return;
    this.busy = true;
    this.dirty = false;
    try {
      const result = await api('/plans/' + encodeURIComponent(this.id), {
        method: 'PUT',
        token: this.token,
        body: { state, revision: this.revision }
      });
      this.revision = result.revision;
      this.updatedAt = result.updatedAt;
      this.setStatus(this.describe());
    } catch (error) {
      this.dirty = true;
      if (error.status === 409) {
        this.conflict = true;
        this.setStatus('Someone else changed the shared plan. Reload to see it; your draft is kept.');
      } else {
        this.setStatus(error.message + ' Use Retry save.');
      }
    } finally {
      this.busy = false;
      if (this.dirty && !this.conflict) void this.flush(state);
    }
  }
}

// re-rendering is simpler and less bug-prone than patching the DOM in place.

// A read-only viewer sees the whole plan and none of the controls that change it.
function applyViewAccess() {
  if (sharing.canEdit) return;
  $$('#app input:not(#college-search), #app select, #app textarea').forEach((el) => (el.disabled = true));
  $$('#app [data-action]').forEach((el) => {
    if (!READ_ACTIONS.has(el.dataset.action)) el.hidden = true;
  });
}

function update({ recompute = true, persist = true } = {}) {
  if (recompute) plan = planRoutes(state);
  if (!plan.routes.some((r) => r.id === selected)) selected = plan.routes[0]?.id;
  if (persist) sharing.save(state);
  render();
  void refreshRoadMatrix();
}

function dialog({ title, description, body }, wide = false) {
  const el = $('#editor');
  el.classList.toggle('wide', wide);
  $('#editor-content').innerHTML = `<div class="dialog-head"><div><h2 id="dialog-title">${title}</h2><p>${description}</p></div>
    <button class="close" data-action="close-dialog" aria-label="Close">${icon('close')}</button></div>${body}`;
  el.setAttribute('aria-labelledby', 'dialog-title');
  if (!el.open) el.showModal();
  if (!sharing.canEdit) {
    $$('#editor input, #editor select, #editor textarea').forEach((x) => (x.disabled = true));
    $$('#editor [data-action]').forEach((x) => {
      if (!READ_ACTIONS.has(x.dataset.action)) x.hidden = true;
    });
  }
}

// --- road matrix -----------------------------------------------------------

// Measure the real road network between every point the plan uses, but only
// when the set of points has actually changed.
async function refreshRoadMatrix(force = false) {
  if (!sharing.canEdit) return;
  let points;
  try {
    points = routingPoints(state).filter((p) => isCoordinate(p));
  } catch {
    return; // an unknown city: validation will report it
  }
  // Measuring is only worth a network call once at least one campus is pinned:
  // city-to-city legs are modelled from reference points either way.
  if (points.length < 2 || points.length > 100) return;
  if (!force && !state.colleges.some(hasCampusPin)) return;
  const signature = matrixSignature(points);
  if (!force && state.network?.signature === signature) return;

  const job = ++matrixJob;
  networkBusy = true;
  networkMessage = `Measuring road routes between ${points.length} points…`;
  render();
  try {
    const matrix = await fetchRoadMatrix(points);
    if (job !== matrixJob) return;
    state.network = matrix;
    networkMessage = '';
    networkBusy = false;
    plan = planRoutes(state);
    sharing.save(state);
    render();
    toast('Road times updated from OSRM.');
  } catch (error) {
    if (job !== matrixJob) return;
    networkBusy = false;
    networkMessage = error.message + ' Estimates are being used instead.';
    render();
  }
}

    ${pin.address ? '· ' + esc(pin.address) : ''} — tick the box below to confirm it.`;

// --- railway stations ------------------------------------------------------

async function loadStations(point, retry = false) {
  const key = pointKey(point);
  const cached = state.stationLookups?.[key];
  if (validStationLookup(cached, point) && !retry) return cached;
  if (stationJobs.has(key)) return stationJobs.get(key);
  if (!retry && Date.now() - (stationFailures.get(key) || 0) < 600000) {
    throw new Error('Station lookup failed recently. Use the button again to retry.');
  }
  const job = (async () => {
    try {
      const value = await nearestStations(point);
      state.stationLookups = { ...state.stationLookups, [key]: value };
      stationFailures.delete(key);
      sharing.save(state);
      render();
      return value;
    } catch (error) {
      stationFailures.set(key, Date.now());
      throw error;
    } finally {
      stationJobs.delete(key);
    }
  })();
  stationJobs.set(key, job);
  return job;
}

// Offer the nearest station at both ends of a leg, with measured transfers.
async function fillLegStations(leg, force = false) {
  const form = $('#leg-form');
  if (!form) return;
  const status = $('#rail-station-status');
  const choices = $('#rail-station-choices');
  status.textContent = 'Finding the nearest stations at both ends…';
  try {
    const [from, to] = await Promise.all([loadStations(leg.fromPoint, force), loadStations(leg.toPoint, force)]);
    if (!form.isConnected) return;
    choices.innerHTML = [['from', from], ['to', to]]
      .map(([side, entry]) => `<label class="field">${side === 'from' ? 'Departure' : 'Arrival'} station · nearest first
        <select data-rail-station="${side}">${entry.stations
          .map((s, i) => `<option value="${i}">${esc(s.name)}${s.code ? ' (' + esc(s.code) + ')' : ''} · ${num(s.distance)} km straight-line</option>`)
          .join('')}</select></label>`)
      .join('');
    form.elements.fromStation.value = from.stations[0].name;
    form.elements.toStation.value = to.stations[0].name;

    status.textContent = 'Measuring road transfers to and from the stations…';
    const [a, b] = await Promise.all([
      stationTransfers(leg.fromPoint, from.stations[0]),
      stationTransfers(leg.toPoint, to.stations[0])
    ]);
    if (!form.isConnected) return;
    if (a.outbound?.hours) {
      form.elements.railDepartureHours.value = a.outbound.hours.toFixed(2);
      form.elements.railDepartureKm.value = Math.round(a.outbound.distance);
    }
    if (b.inbound?.hours) {
      form.elements.railArrivalHours.value = b.inbound.hours.toFixed(2);
      form.elements.railArrivalKm.value = Math.round(b.inbound.distance);
    }
    status.textContent = 'Stations and transfers filled in. Add the train time and distance from the timetable.';
  } catch (error) {
    status.textContent = error.message;
  }
}

function importFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const text = String(reader.result);
      const next = file.name.toLowerCase().endsWith('.csv') ? csvPlan(text, state) : JSON.parse(text);
      const errors = validateState(next);
      if (errors.length) throw new Error(errors[0]);
      pendingImport = next;
      dialog(importPreviewDialog(next, planRoutes(next)));
    } catch (error) {
      dialog({
        title: 'This file needs a fix',
        description: 'Your current plan has not changed.',
        body: `<div class="dialog-body"><div class="dialog-error">${esc(error.message)}</div>
          <div class="form-note">Import a plan exported from here, or a CSV with the headers college, city, date, start, duration, team and
            optionally latitude, longitude, address, airport, interview_date, interview_start, interview_duration.</div></div>
          <div class="dialog-footer">${actButton('close-dialog', 'Close', 'secondary')}${actButton('import', 'Choose another file', 'primary', 'upload')}</div>`
      });
    }
  };
  reader.onerror = () => toast('That file could not be read.');
  reader.readAsText(file);
}

// --- form submissions ------------------------------------------------------

function saveCollege(form) {
  const f = form.elements;
  const lat = Number(f.lat.value);
  const lng = Number(f.lng.value);
  const hasPin = f.lat.value !== '' && f.lng.value !== '' && isCoordinate({ lat, lng });
  const existing = state.colleges.find((c) => c.id === form.dataset.id);

  const college = {
    ...(existing || {}),
    id: existing?.id || 'c' + Date.now().toString(36),
    name: f.name.value.trim(),
    city: f.city.value,
    date: f.date.value,
    time: f.time.value || '09:00',
    duration: Number(f.duration.value),
    team: f.team.value,
    airport: f.airport.value,
    demo: false,
    ...(hasPin
      ? {
          location: {
            lat, lng,
            address: f.address.value || pendingPin?.address || '',
            source: f.pinSource.value || pendingPin?.source || 'Manual pin',
            confirmed: f.confirmed.checked,
            checkedAt: new Date().toISOString().slice(0, 10)
          }
        }
      : { location: undefined })
  };
  if (f.interviewDate.value) {
    college.interviewDate = f.interviewDate.value;
    college.interviewTime = f.interviewTime.value || '09:00';
    college.interviewDuration = Number(f.interviewDuration.value) || college.duration;
  } else {
    delete college.interviewDate;
    delete college.interviewTime;
    delete college.interviewDuration;
  }
  const next = existing
    ? state.colleges.map((c) => (c.id === college.id ? college : c))
    : [...state.colleges, college];
  const candidate = { ...state, colleges: next, demo: false };
  const errors = validateState(candidate);
  if (errors.length) {
    $('#form-error').textContent = errors[0];
    return;
  }
  if (scheduledVisits(candidate).length > MAX_DATED_VISITS) {
    $('#form-error').textContent = `That would exceed ${MAX_DATED_VISITS} dated visits.`;
    return;
  }
  state = candidate;
  pendingPin = null;
  $('#editor').close();
  update();
  toast(existing ? 'College updated.' : 'College added.');
}

function saveTeam(form) {
  const f = form.elements;
  const existing = state.teams.find((t) => t.id === form.dataset.id);
  const members = f.members.value.split('\n').map((s) => s.trim()).filter(Boolean);
  const availability = {};
  for (const box of $$('#team-form [name="available"]')) {
    const name = box.dataset.member;
    if (!members.includes(name)) continue;
    const from = $(`#team-form [name="unavailableFrom"][data-member="${CSS.escape(name)}"]`)?.value || '';
    const to = $(`#team-form [name="unavailableTo"][data-member="${CSS.escape(name)}"]`)?.value || '';
    const ranges = from && to ? [{ from, to }] : [];
    if (!box.checked || ranges.length) availability[name] = { available: box.checked, unavailable: ranges };
  }

  const team = {
    ...(existing || {}),
    id: existing?.id || 't' + Date.now().toString(36),
    name: f.name.value.trim(),
    size: Number(f.size.value),
    members,
    ...(f.base.value ? { base: f.base.value } : { base: undefined }),
    ...(Object.keys(availability).length ? { memberAvailability: availability } : { memberAvailability: undefined })
  };
  const teams = existing ? state.teams.map((t) => (t.id === team.id ? team : t)) : [...state.teams, team];
  const candidate = { ...state, teams };
  const errors = validateState(candidate);
  if (errors.length) {
    $('#form-error').textContent = errors[0];
    return;
  }
  state = candidate;
  $('#editor').close();
  update();
  toast(existing ? 'Team updated.' : 'Team added.');
}

function saveSettings(form) {
  const settings = { ...state.settings };
  for (const [key] of SETTING_FIELDS) settings[key] = Number(form.elements[key].value);
  settings.priority = form.elements.priority.value;
  const candidate = { ...state, settings };
  const errors = validateState(candidate);
  if (errors.length) {
    toast(errors[0]);
    return;
  }
  state = candidate;
  update();
  toast('Assumptions applied.');
}

function saveLeg(form) {
  const f = form.elements;
  const key = form.dataset.key;
  const override = {};
  if (f.mode.value !== 'auto') override.mode = f.mode.value;
  if (f.road.value) override.road = Number(f.road.value);
  if (f.distance.value) override.distance = Number(f.distance.value);
  if (f.noAir.checked) override.air = null;
  else if (f.air.value) override.air = Number(f.air.value);

  const railFields = {
    fromStation: f.fromStation.value.trim(),
    toStation: f.toStation.value.trim(),
    hours: Number(f.railHours.value),
    km: Number(f.railKm.value),
    departureHours: Number(f.railDepartureHours.value),
    departureKm: Number(f.railDepartureKm.value),
    arrivalHours: Number(f.railArrivalHours.value),
    arrivalKm: Number(f.railArrivalKm.value),
    buffer: Number(f.railBuffer.value)
  };
  const railEntered = railFields.fromStation || railFields.toStation || railFields.hours || railFields.km;
  if (railEntered) override.rail = railFields;

  const overrides = { ...state.overrides };
  if (Object.keys(override).length) overrides[key] = override;
  else delete overrides[key];

  const candidate = { ...state, overrides };
  const errors = validateState(candidate);
  if (errors.length) {
    $('#form-error').textContent = errors[0];
    return;
  }
  state = candidate;
  $('#editor').close();
  update();
  // An override is tied to its exact endpoints. Re-planning can move a route to
  // another base, and then the adjusted leg is simply not part of the plan any
  // more — say so rather than leaving the user to wonder.
  const stillUsed = plan.routes.some((r) => r.legs.some((l) => l.key === key));
  toast(stillUsed ? 'Leg updated.' : 'Saved. That leg is not in the current plan any more — the routes were re-planned around it.');
}

function saveStaffing(form) {
  const id = form.dataset.id;
  const requiredPeople = Number(form.elements.requiredPeople.value);
  const assignedMembers = $$('#staffing-form [name="assignedMember"]:checked').map((x) => x.value);
  const colleges = state.colleges.map((c) => (c.id === id ? { ...c, requiredPeople, assignedMembers } : c));
  const candidate = { ...state, colleges };
  const errors = validateState(candidate);
  if (errors.length) {
    $('#form-error').textContent = errors[0];
    return;
  }
  state = candidate;
  $('#editor').close();
  update();
  toast('Staffing saved.');
}

// --- event wiring ----------------------------------------------------------

// A read-only viewer's clicks, edits and submissions stop here.
for (const type of ['click', 'change', 'submit']) {
  document.addEventListener(type, (e) => {
    if (sharing.canEdit) return;
    if (type === 'submit' || (type === 'change' && e.target.id !== 'college-search')) {
      e.preventDefault();
      e.stopImmediatePropagation();
      return;
    }
    const action = e.target.closest('[data-action]')?.dataset.action;
    if (action && !READ_ACTIONS.has(action)) {
      e.preventDefault();
      e.stopImmediatePropagation();
    }
  }, true);
}

document.addEventListener('click', async (e) => {
  const el = e.target.closest('button, [data-route]');
  if (!el) return;

  if (el.dataset.tab) {
    tab = el.dataset.tab;
    render();
    return;
  }
  if (el.dataset.route) {
    selected = el.dataset.route;
    tab = 'routes';
    detail = 'schedule';
    render();
    $('.timeline-panel')?.scrollIntoView({ block: 'start', behavior: 'smooth' });
    return;
  }
  if (el.dataset.detail) {
    detail = el.dataset.detail;
    render();
    return;
  }

  const action = el.dataset.action;
  if (!action) return;

  switch (action) {
    case 'close-dialog':
      $('#editor').close();
      return;
    case 'help':
      dialog(helpDialog(ctx()));
      return;
    case 'go-colleges':
      tab = 'colleges';
      render();
      return;
    case 'optimize':
      update();
      tab = 'routes';
      render();
      toast(plan.errors.length ? 'Review the input alerts.' : `Planned ${plan.routes.length} routes · ${plan.metrics?.covered || 0} visits covered.`);
      return;

    // sharing
    case 'publish':
    case 'fork-plan': {
      el.disabled = true;
      try {
        const links = action === 'publish' ? await sharing.publish(state) : await sharing.fork(state);
        update({ recompute: false, persist: false });
        dialog(shareDialog(links, action === 'fork-plan' ? 'forked' : 'published'));
      } catch (error) {
        toast(error.message);
      } finally {
        el.disabled = false;
      }
      return;
    }
    case 'copy-view-link':
    case 'copy-edit-link': {
      const url = planUrl(sharing.id, action === 'copy-edit-link' ? sharing.token : '');
      toast((await copyText(url)) ? 'Link copied.' : url);
      return;
    }
    case 'retry-save':
      sharing.dirty = true;
      sharing.conflict = false;
      void sharing.flush(state);
      return;
    case 'reload-shared': {
      const loaded = await sharing.load();
      if (loaded) {
        state = loaded;
        update({ recompute: true, persist: false });
      } else render();
      return;
    }

    // colleges
    case 'add-college':
      dialog(collegeDialog(ctx(), null), true);
      return;
    case 'edit-college':
      dialog(collegeDialog(ctx(), el.dataset.id), true);
      return;
    case 'delete-college': {
      const college = state.colleges.find((c) => c.id === el.dataset.id);
      if (college) dialog(deleteCollegeDialog(college));
      return;
    }
    case 'confirm-delete-college':
      state = { ...state, colleges: state.colleges.filter((c) => c.id !== el.dataset.id), demo: false };
      $('#editor').close();
      update();
      toast('College removed.');
      return;
    case 'college-staffing': {
      const d = staffingDialog(ctx(), el.dataset.id);
      if (d) dialog(d, true);
      return;
    }
    case 'load-starter': {
      const existing = new Set(state.colleges.map((c) => c.name.toLowerCase()));
      const additions = starterColleges().filter((c) => !existing.has(c.name.toLowerCase()));
      state = { ...state, demo: false, colleges: [...state.colleges.filter((c) => !c.name.endsWith('(demo)')), ...additions] };
      update();
      toast(`${additions.length} colleges added. Add dates to plan them.`);
      return;
    }
    case 'find-campus':
      void findCampus();
      return;
    case 'choose-campus':
      fillCampusPin(locationMatches[Number(el.dataset.index)]);
      return;
    case 'parse-campus-pin': {
      const pin = extractCoordinates($('#campus-pin-input').value);
      if (pin) fillCampusPin({ ...pin, source: 'Manual pin' });
      else $('#location-results').innerHTML = '<div class="dialog-error">Paste a latitude and longitude, or a link that contains a place pin. A map viewport is not a campus.</div>';
      return;
    }
    case 'college-station': {
      const college = state.colleges.find((c) => c.id === el.dataset.id);
      if (!college || !hasCampusPin(college)) return;
      el.disabled = true;
      try {
        await loadStations(college.location, true);
      } catch (error) {
        toast(error.message);
      } finally {
        if (el.isConnected) el.disabled = false;
      }
      return;
    }

    // teams
    case 'add-team':
      dialog(teamDialog(ctx(), null));
      return;
    case 'edit-team':
      dialog(teamDialog(ctx(), el.dataset.id));
      return;
    case 'delete-team': {
      if (state.teams.length === 1) {
        toast('Keep at least one travelling team.');
        return;
      }
      const id = el.dataset.id;
      state = {
        ...state,
        teams: state.teams.filter((t) => t.id !== id),
        colleges: state.colleges.map((c) => (c.team === id ? { ...c, team: 'auto' } : c))
      };
      $('#editor').close();
      update();
      toast('Team removed. Its visits are auto-assigned again.');
      return;
    }
    case 'compare-bases':
      dialog(compareDialog(ctx()), true);
      return;
    case 'select-base':
      state = { ...state, base: el.dataset.value };
      $('#editor').close();
      update();
      toast('Default base updated. Teams with their own base are unchanged.');
      return;

    // legs, settings, pins
    case 'edit-leg': {
      const d = legDialog(ctx(), Number(el.dataset.index));
      if (d) dialog(d, true);
      return;
    }
    case 'reset-leg': {
      const overrides = { ...state.overrides };
      delete overrides[el.dataset.key];
      state = { ...state, overrides };
      $('#editor').close();
      update();
      toast('Model estimates restored for that leg.');
      return;
    }
    case 'nearest-leg-stations': {
      const route = plan.routes.find((r) => r.id === selected);
      const leg = route?.legs.find((l) => l.key === $('#leg-form')?.dataset.key);
      if (leg) void fillLegStations(leg, true);
      return;
    }
    case 'refresh-roads':
      void refreshRoadMatrix(true);
      return;
    case 'airport-pins':
      dialog(airportPinsDialog(ctx()));
      return;
    case 'reset-airport-pin': {
      const pins = { ...(state.airportPins || {}) };
      delete pins[el.dataset.code];
      state = { ...state, airportPins: Object.keys(pins).length ? pins : undefined };
      $('#editor').close();
      update();
      return;
    }

    // exports and imports
    case 'export-menu':
      dialog(exportDialog());
      return;
    case 'export-json':
      exportJSON();
      return;
    case 'export-csv':
      exportCalendarCSV();
      return;
    case 'export-detail-csv':
      exportDetailCSV();
      return;
    case 'export-text':
      exportText();
      return;
    case 'print':
      $('#editor').close();
      window.print();
      return;
    case 'csv-template':
      download('campusroute-template.csv', CSV_TEMPLATE, 'text/csv');
      return;
    case 'import':
      $('#editor').close();
      $('#import-file').value = '';
      $('#import-file').click();
      return;
    case 'confirm-import':
      if (!pendingImport) return;
      state = pendingImport;
      pendingImport = null;
      $('#editor').close();
      tab = 'colleges';
      update();
      toast('Plan imported and routes recalculated.');
      return;
    default:
      return;
  }
});

document.addEventListener('submit', (e) => {
  const form = e.target;
  const handlers = {
    'college-form': saveCollege,
    'team-form': saveTeam,
    'settings-form': saveSettings,
    'leg-form': saveLeg,
    'staffing-form': saveStaffing
  };
  if (form.id === 'airport-pin-form') {
    e.preventDefault();
    const code = form.elements.code.value;
    const p = { lat: Number(form.elements.lat.value), lng: Number(form.elements.lng.value) };
    if (!isCoordinate(p)) {
      $('#airport-error').textContent = 'Enter valid access coordinates.';
      return;
    }
    state = { ...state, airportPins: { ...state.airportPins, [code]: p } };
    $('#editor').close();
    update();
    toast('Airport access pin saved.');
    return;
  }
  const handler = handlers[form.id];
  if (!handler) return;
  e.preventDefault();
  handler(form);
});

// Inline date edits on the colleges tab, and the default-base picker.
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.collegeDate || t.dataset.collegeInterview) {
    const id = t.dataset.collegeDate || t.dataset.collegeInterview;
    const field = t.dataset.collegeDate ? 'date' : 'interviewDate';
    const colleges = state.colleges.map((c) => (c.id === id ? { ...c, [field]: t.value, demo: false } : c));
    const candidate = { ...state, colleges, demo: false };
    const errors = validateState(candidate);
    if (errors.length) {
      toast(errors[0]);
      render();
      return;
    }
    state = candidate;
    update();
    return;
  }
  if (t.id === 'default-base') {
    state = { ...state, base: t.value };
    update();
    toast('Default base updated.');
    return;
  }
  if (t.dataset.railStation) {
    const form = $('#leg-form');
    const route = plan.routes.find((r) => r.id === selected);
    const leg = route?.legs.find((l) => l.key === form?.dataset.key);
    if (!leg) return;
    const point = t.dataset.railStation === 'from' ? leg.fromPoint : leg.toPoint;
    const entry = state.stationLookups?.[pointKey(point)];
    const station = entry?.stations?.[Number(t.value)];
    if (station) form.elements[t.dataset.railStation === 'from' ? 'fromStation' : 'toStation'].value = station.name;
    return;
  }
  if (t.id === 'import-file' && t.files?.[0]) importFile(t.files[0]);
});

// The college search filters in place, without a full re-render.
document.addEventListener('input', (e) => {
  if (e.target.id !== 'college-search') return;
  collegeSearch = e.target.value;
  const q = collegeSearch.toLowerCase().trim();
  let count = 0;
  $$('[data-college-name]').forEach((row) => {
    row.hidden = !row.dataset.collegeName.includes(q);
    if (!row.hidden) count++;
  });
  $('#college-search-count').textContent = `${count} of ${state.colleges.length} shown`;
});

document.addEventListener('keydown', (e) => {
  const row = e.target.closest('[data-route]');
  if (row && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    selected = row.dataset.route;
    tab = 'routes';
    detail = 'schedule';
    render();
  }
});

window.addEventListener('beforeunload', (e) => {
  if (sharing.mode === 'shared-edit' && (sharing.dirty || sharing.busy)) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// A read-only viewer follows the plan as the owner edits it.
setInterval(() => {
  if (sharing.mode !== 'shared-view' || document.hidden || $('#editor').open) return;
  void sharing.load().then((loaded) => {
    if (!loaded) return;
    state = loaded;
    plan = planRoutes(state);
    render();
  });
}, 30000);

// --- start -----------------------------------------------------------------

render();
sharing.open().then((loaded) => {
  if (loaded) {
    state = loaded;
    plan = planRoutes(state);
    tab = state.colleges.some((c) => c.date || c.interviewDate) ? 'routes' : 'colleges';
    selected = plan.routes[0]?.id;
  }
  render();
  void refreshRoadMatrix();
});
})();
</script>
